name: Build image (reusable)

# Builds the app's Docker image ON GITHUB-HOSTED RUNNERS and pushes a
# manifest list for linux/arm64 to ghcr.io. Every deploy
# workflow (prod / preview / topic) calls this instead of running
# `docker build` on the server.
#
# WHY (2026-07-29): while this repo was private the hosted Actions quota ran out,
# so the deploys were moved onto a self-hosted runner *on the server itself*
# (#636) — which meant the production box did an `npm ci` + `next build` for
# every merge and for every push to every open PR. The repo was public from then
# until 2026-10, so hosted standard runners were free and the build moved back
# here, leaving the server with `docker pull` + container swap. The repo is
# private again since 2026-10 (Free plan: 2,000 hosted minutes a month, arm64
# included, #2910). The build stays hosted anyway: compiling on the production
# box is what this file exists to avoid.
#
# WHY ARM64 ONLY (2026-10, #2916): the server is an Oracle Cloud Ampere
# instance, which is **arm64** (#2166). Prod, preview and every topic env run
# there. An amd64 image does not fail at `docker pull`; it fails later, at
# `docker run`, with "exec format error", so the failure would land in the
# deploy step of a green pipeline. From 2026-09-05 both arches were published,
# because the old (amd64) box and the new one were live at the same time. The
# old box was retired on 2026-09-06, and nothing has pulled an amd64 image since.
# The amd64 leg was dropped once the repo went private and every hosted minute
# started to count (~5,400 a month, #2910). The cost: an x86 machine can no
# longer `docker run` a ghcr image natively. Run the app from source there.
#
# Each arch builds on its OWN NATIVE RUNNER (`ubuntu-24.04-arm`: free while the
# repo was public; in a private repo it is metered from the same 2,000-minute
# pool as x64, at $0.005/min against x64's $0.006, and gets 2 vCPUs instead of
# 4). `platforms: linux/amd64,linux/arm64` on one runner would build the foreign
# arch under QEMU emulation, and `npm ci` + `next build` emulated takes tens of
# minutes. The legs are a matrix and the merge job stitches their digests into
# one manifest list. Bringing amd64 back means adding its matrix entry AND its
# name to EXPECTED_ARCHES in the merge job, nothing else.
#
# The image is the ONLY artifact that crosses over. Secrets still never leave the
# server (deploy-prod.sh reads /etc/internship-crm/*.env there) and no build-time
# secret is baked in — see the Dockerfile.
#
# The caller must grant `packages: write`; the ghcr package inherits the repo's
# visibility, and the deploy job pulls it with the same GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA (or ref) to build — pass an exact SHA so the built image, the deployed commit and the baked GIT_SHA all agree'
        required: true
        type: string
      tag:
        description: 'Image tag only, e.g. prod-a1b2c3d / preview-a1b2c3d / topic-pr123'
        required: true
        type: string
      app_env:
        description: "NEXT_PUBLIC_APP_ENV build arg: 'production' or 'preview' (inlined at build time, so it must be set here)"
        required: false
        default: preview
        type: string
    outputs:
      image:
        description: 'Fully-qualified, multi-arch image reference that was pushed'
        value: ${{ jobs.merge.outputs.image }}

jobs:
  # Resolve everything that must be IDENTICAL across the two architecture
  # builds exactly once. Computing the release stamps inside each matrix leg
  # would risk the two legs disagreeing (they read git history, and a race with
  # a concurrent merge would bake different versions into the same manifest).
  prep:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repo: ${{ steps.meta.outputs.repo }}
      stamps: ${{ steps.stamps.outputs.json }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: the release stamps below are read from the commit that
          # added each pending fragment (#1457).
          fetch-depth: 0

      # .dockerignore excludes .git, so `next build` inside the image cannot ask
      # git when each pending change shipped. Resolve it here and hand the answer
      # to the build as one JSON line; without it the build would fall back to
      # filename order and the released versions would lose their dates (#1457).
      - name: Resolve release stamps
        id: stamps
        run: |
          # Assigned to a variable first, deliberately: inside `echo "x=$(cmd)"`
          # a failing cmd is discarded by the shell and the step would go green
          # with empty stamps, shipping undated versions in filename order.
          STAMPS="$(node scripts/release-derive.cjs --stamps)"
          echo "json=$STAMPS" >> "$GITHUB_OUTPUT"

      - name: Resolve image reference
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Docker image names must be lower-case; the repo is "21072026/Internship".
          REPO="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ inputs.tag }} (${{ matrix.arch }})
    needs: prep
    runs-on: ${{ matrix.runner }}
    strategy:
      # With more than one arch, every leg is reported even when one fails: a
      # red leg next to a green one is the exact signal that something is
      # arch-specific.
      fail-fast: false
      matrix:
        # amd64 dropped in 2026-10 (#2916, see the header). Keep EXPECTED_ARCHES
        # in the merge job in step with this list.
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ inputs.ref }}
            NEXT_PUBLIC_APP_ENV=${{ inputs.app_env }}
            RELEASE_STAMPS=${{ needs.prep.outputs.stamps }}
          # No tag here: each leg pushes an untagged, digest-addressed image and
          # the merge job below binds the tag to the manifest list. Tagging both
          # legs would make them overwrite each other, and whichever finished
          # last would be the only arch the tag resolved to.
          outputs: type=image,name=${{ needs.prep.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache lives in the Actions cache, so repeat builds of the same
          # dependency set skip the expensive `npm ci` layer. Scoped per arch —
          # a shared scope would have the two legs evicting each other's layers
          # on every run.
          cache-from: type=gha,scope=${{ inputs.app_env }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app_env }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo "::error::build produced no digest"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.tag }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ inputs.tag }} manifest
    needs: [prep, build]
    runs-on: ubuntu-latest
    env:
      # The arches the matrix above builds, space-separated. The two checks
      # below fail CLOSED against this list.
      EXPECTED_ARCHES: arm64
    outputs:
      image: ${{ needs.prep.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ inputs.tag }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prep.outputs.image }}
          REPO: ${{ needs.prep.outputs.repo }}
        run: |
          # One file per arch, each named after its digest. Any count other
          # than EXPECTED_ARCHES means a matrix leg silently produced nothing,
          # and publishing a manifest that lacks an arch under the shared tag
          # is exactly the failure this workflow exists to prevent.
          COUNT="$(find . -type f | wc -l)"
          WANT="$(wc -w <<< "$EXPECTED_ARCHES")"
          if [ "$COUNT" -ne "$WANT" ]; then
            echo "::error::expected $WANT architecture digest(s) ($EXPECTED_ARCHES), found $COUNT"
            exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE" \
            $(printf "${REPO}@sha256:%s " $(find . -type f -printf '%f '))

      - name: Verify every expected architecture resolves
        env:
          IMAGE: ${{ needs.prep.outputs.image }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > manifest.json
          # Parsed, not grepped. The first version of this step looked for the
          # substring `"architecture":"amd64"` and reported a perfectly good
          # two-arch manifest as broken: whitespace in the JSON `--raw` prints
          # is not contractual, and this check fails CLOSED, so getting it wrong
          # blocks every deploy. buildx also appends provenance entries whose
          # platform is os/architecture "unknown" — filtered out here rather
          # than counted as an architecture.
          ARCHES="$(jq -r '[.manifests[]?.platform | select(.os != "unknown") | .architecture] | sort | join(",")' manifest.json)"
          echo "manifest platforms: $ARCHES"
          for want in $EXPECTED_ARCHES; do
            case ",$ARCHES," in
              *",$want,"*) ;;
              *) echo "::error::$want missing from $IMAGE manifest (found: $ARCHES)"; exit 1 ;;
            esac
          done
          echo "present: $EXPECTED_ARCHES"

      - name: Summary
        env:
          IMAGE: ${{ needs.prep.outputs.image }}
        run: |
          {
            echo "### Pushed \`$IMAGE\`"
            echo
            echo "Platforms: $(printf '`linux/%s` ' $EXPECTED_ARCHES)"
          } >> "$GITHUB_STEP_SUMMARY"
