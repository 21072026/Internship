name: Build image (reusable)

# Builds the app's Docker image ON A GITHUB-HOSTED RUNNER and pushes it to
# ghcr.io as a linux/arm64 image. Every deploy workflow (prod / preview / topic)
# calls this instead of running `docker build` on the server.
#
# WHY (2026-07-29): while this repo was private the hosted Actions quota ran out,
# so the deploys were moved onto a self-hosted runner *on the server itself*
# (#636) — which meant the production box did an `npm ci` + `next build` for
# every merge and for every push to every open PR. The repo was public from then
# until 2026-10, so hosted standard runners were free and the build moved back
# here, leaving the server with `docker pull` + container swap. The repo is
# private again since 2026-10 (Free plan: 2,000 hosted minutes a month, arm64
# included, #2910). The build stays hosted anyway: compiling on the production
# box is what this file exists to avoid.
#
# WHY ARM64 ONLY (2026-10-14, #2917): every environment runs on the Oracle
# Cloud Ampere box, which is **arm64** — prod, preview and every topic env. From
# 2026-09-05 (#2166) this built amd64 + arm64 on two native runners and stitched
# them into one manifest list, because the old amd64 server and the new box were
# live at the same time. The old server retired on 2026-09-06, and nothing has
# pulled the amd64 half since; it cost ~5,400 metered minutes a month. With one
# arch there is nothing to stitch, so the separate "resolve inputs" and "publish
# manifest" jobs (a whole minute each, billed per job) folded into this one.
#
# THE ARCH CHECK STILL FAILS CLOSED. An image of the wrong arch does not fail at
# `docker pull` — it fails later, at `docker run`, with "exec format error", so
# the failure would land in the deploy step of a green pipeline. The last step
# below refuses a pushed tag that does not resolve to linux/arm64. If an amd64
# host ever comes back, add a second job for it and stitch the two again (the
# matrix + `imagetools create` version is in git history before #2917); never
# use `platforms: linux/amd64,linux/arm64` on one runner — the foreign arch
# builds under QEMU emulation and `npm ci` + `next build` takes tens of minutes.
#
# `ubuntu-24.04-arm` was free while the repo was public; in a private repo it is
# metered from the same 2,000-minute pool as x64, at $0.005/min against x64's
# $0.006, and gets 2 vCPUs instead of 4.
#
# The image is the ONLY artifact that crosses over. Secrets still never leave the
# server (deploy-prod.sh reads /etc/internship-crm/*.env there) and no build-time
# secret is baked in — see the Dockerfile.
#
# The caller must grant `packages: write`; the ghcr package inherits the repo's
# visibility, and the deploy job pulls it with the same GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA (or ref) to build — pass an exact SHA so the built image, the deployed commit and the baked GIT_SHA all agree'
        required: true
        type: string
      tag:
        description: 'Image tag only, e.g. prod-a1b2c3d / preview-a1b2c3d / topic-pr123'
        required: true
        type: string
      app_env:
        description: "NEXT_PUBLIC_APP_ENV build arg: 'production' or 'preview' (inlined at build time, so it must be set here)"
        required: false
        default: preview
        type: string
    outputs:
      image:
        description: 'Fully-qualified linux/arm64 image reference that was pushed'
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build ${{ inputs.tag }} (arm64)
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: the release stamps below are read from the commit that
          # added each pending fragment (#1457).
          fetch-depth: 0

      # The stamps script is dependency-free, but it needs a node on PATH; pin
      # the same major the rest of CI uses rather than whatever the arm image
      # happens to ship.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # .dockerignore excludes .git, so `next build` inside the image cannot ask
      # git when each pending change shipped. Resolve it here and hand the answer
      # to the build as one JSON line; without it the build would fall back to
      # filename order and the released versions would lose their dates (#1457).
      - name: Resolve release stamps
        id: stamps
        run: |
          # Assigned to a variable first, deliberately: inside `echo "x=$(cmd)"`
          # a failing cmd is discarded by the shell and the step would go green
          # with empty stamps, shipping undated versions in filename order.
          STAMPS="$(node scripts/release-derive.cjs --stamps)"
          echo "json=$STAMPS" >> "$GITHUB_OUTPUT"

      - name: Resolve image reference
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Docker image names must be lower-case; the repo is "21072026/Internship".
          REPO="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            GIT_SHA=${{ inputs.ref }}
            NEXT_PUBLIC_APP_ENV=${{ inputs.app_env }}
            RELEASE_STAMPS=${{ steps.stamps.outputs.json }}
          tags: ${{ steps.meta.outputs.image }}
          push: true
          # Layer cache lives in the Actions cache, so repeat builds of the same
          # dependency set skip the expensive `npm ci` layer. The scope name is
          # the one the arm64 leg of the old two-arch matrix used, so the warm
          # cache carries over.
          cache-from: type=gha,scope=${{ inputs.app_env }}-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.app_env }}-arm64

      - name: Verify the tag resolves to linux/arm64
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > manifest.json
          # Parsed, not grepped: whitespace in the JSON `--raw` prints is not
          # contractual, and this check fails CLOSED, so getting it wrong blocks
          # every deploy. buildx pushes an index that also carries a provenance
          # entry whose platform is os/architecture "unknown" — filtered out
          # here rather than counted as an architecture.
          ARCHES="$(jq -r '[.manifests[]?.platform | select(.os != "unknown") | .architecture] | sort | join(",")' manifest.json)"
          echo "manifest platforms: $ARCHES"
          if [ "$ARCHES" != "arm64" ]; then
            echo "::error::$IMAGE should resolve to linux/arm64 only (found: ${ARCHES:-none})"
            exit 1
          fi

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          {
            echo "### Pushed \`$IMAGE\`"
            echo
            echo "Platform: \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
