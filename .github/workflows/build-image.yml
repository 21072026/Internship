name: Build image (reusable)

# Builds the app's Docker image ON A GITHUB-HOSTED RUNNER and pushes it to
# ghcr.io. Every deploy workflow (prod / preview / topic) calls this instead of
# running `docker build` on the Plesk server.
#
# WHY (2026-07-29): while this repo was private the hosted Actions quota ran out,
# so the deploys were moved onto a self-hosted runner *on the server itself*
# (#636) — which meant the production box did an `npm ci` + `next build` for
# every merge and for every push to every open PR. The repo is public now, so
# hosted standard runners are free and unmetered: the build belongs back here,
# and the server is left with `docker pull` + container swap.
#
# The image is the ONLY artifact that crosses over. Secrets still never leave the
# server (deploy-prod.sh reads /etc/internship-crm/*.env there) and no build-time
# secret is baked in — see the Dockerfile.
#
# The caller must grant `packages: write`; the ghcr package inherits the repo's
# visibility, and the deploy job pulls it with the same GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA (or ref) to build — pass an exact SHA so the built image, the deployed commit and the baked GIT_SHA all agree'
        required: true
        type: string
      tag:
        description: 'Image tag only, e.g. prod-a1b2c3d / preview-a1b2c3d / topic-pr123'
        required: true
        type: string
      app_env:
        description: "NEXT_PUBLIC_APP_ENV build arg: 'production' or 'preview' (inlined at build time, so it must be set here)"
        required: false
        default: preview
        type: string
    outputs:
      image:
        description: 'Fully-qualified image reference that was pushed'
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build ${{ inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: the release stamps below are read from the commit that
          # added each pending fragment (#1457).
          fetch-depth: 0

      # .dockerignore excludes .git, so `next build` inside the image cannot ask
      # git when each pending change shipped. Resolve it here and hand the answer
      # to the build as one JSON line; without it the build would fall back to
      # filename order and the released versions would lose their dates (#1457).
      - name: Resolve release stamps
        id: stamps
        run: |
          # Assigned to a variable first, deliberately: inside `echo "x=$(cmd)"`
          # a failing cmd is discarded by the shell and the step would go green
          # with empty stamps, shipping undated versions in filename order.
          STAMPS="$(node scripts/release-derive.cjs --stamps)"
          echo "json=$STAMPS" >> "$GITHUB_OUTPUT"

      # CycloneDX SBOM for the production dependency tree (#2059). Written to
      # public/sbom.cdx.json *before* the docker build, so `COPY . .` picks it
      # up and the image serves it at /sbom.cdx.json — unauthenticated, and
      # always describing the tree that same image installed from the lockfile.
      # Procurement asks for this and will not create an account to get it.
      #
      # --require-stamps: refuse to write an SBOM that cannot name its commit.
      # An SBOM stamped "unknown" is worse than a missing one, because it reads
      # as an answer. RELEASE_STAMPS is passed through so the stamped version is
      # the derived one (base + pending fragments, #1457) rather than
      # package.json's base — the same number the app's footer reports.
      #
      # No `npm ci` here on purpose: the generator runs --package-lock-only, so
      # the SBOM comes from the lockfile and this step adds seconds, not
      # minutes. It fails the build if the registry is unreachable.
      - name: Generate SBOM
        env:
          RELEASE_STAMPS: ${{ steps.stamps.outputs.json }}
          # Through env rather than inlined into the shell, same as the step
          # below: a `${{ }}` expansion inside `run:` is substituted before bash
          # sees it, so an input with shell metacharacters would be executed.
          REF: ${{ inputs.ref }}
        run: node scripts/generate-sbom.mjs --commit "$REF" --require-stamps

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.tag }}
          path: public/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Resolve image reference
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Docker image names must be lower-case; the repo is "21072026/Internship".
          REPO="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            GIT_SHA=${{ inputs.ref }}
            NEXT_PUBLIC_APP_ENV=${{ inputs.app_env }}
            RELEASE_STAMPS=${{ steps.stamps.outputs.json }}
          # Layer cache lives in the Actions cache, so repeat builds of the same
          # dependency set skip the expensive `npm ci` layer.
          cache-from: type=gha,scope=${{ inputs.app_env }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app_env }}

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### Pushed \`$IMAGE\`"
            echo ""
            echo "CycloneDX SBOM attached as \`sbom-$TAG\`, and served by this image at \`/sbom.cdx.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
