name: E2E Full Suite (scheduled)

# The PR gate (e2e.yml) runs only the @smoke subset; this workflow is the safety
# net behind it (#621/#624): the FULL Playwright suite, 4× a day, 4-way sharded,
# plus the `isolation` project in a job of its own (#1566 — it needs a second
# Next server with MT_ENFORCE_ISOLATION=true and cannot share a run with the
# default project), with a Turkish summary email when a run goes red — the failing tests with
# error snippets (scripts/e2e-report-email.mjs). Red-only is the default since
# 2026-08-23 (maintainer request: green heartbeats were noise); set the repo
# variable E2E_REPORT_MODE=always to bring the "✅ N/N test geçti" heartbeat
# back. Can also be run on demand.
#
# Drift gate (same idea as deploy-prod's): a scheduled firing SKIPS the whole
# run when this exact commit already has a GREEN run — re-testing a commit the
# suite already passed only burns runner minutes. The verdict is load-bearing
# (#2374): the gate used to ask for the last *completed* run of any conclusion,
# so the first red run on a commit silenced every later firing on it, and each
# of those skips reported as a green check in the Actions list. A red commit is
# now re-tested (and re-mailed) every 6h until it is green or a new commit
# lands — that is the point of the alert, and a re-run also tells a flake apart
# from a real break. workflow_dispatch always runs (manual = deliberate).
#
# Cost note: this repo is PUBLIC, so GitHub-hosted standard runners are free
# and unmetered (private 2026-10-08..14, public again since 2026-10-14, #2949).
# Sharding multiplies billed minutes (each shard repeats npm ci + prisma +
# build + browser install) but cuts wall-clock ~4×, and with 200+ spec files at
# `workers: 1` a serial run is hours long. Free minutes make that trade obvious,
# so the 4×/day sharded cadence from #627 is back — it had been cut to 1×/day
# serial while the private-repo quota was exhausted (#636/#648).
#
# Note: GitHub scheduled workflows can lag a few minutes and are disabled
# automatically after 60 days without repository activity.
on:
  schedule:
    # 4× a day at 03/09/15/21 UTC (~05/11/17/23 Europe/Berlin in summer).
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-full
  cancel-in-progress: false

jobs:
  # Skip a scheduled firing only when this exact commit ALREADY PASSED. Anything
  # else — never tested, or tested and red — runs.
  #
  # `status=` on the workflow-runs endpoint is overloaded: it accepts status
  # values (queued/in_progress/completed) *and* conclusion values, so
  # `status=success` means "completed and green". Verified against this repo's
  # own history while writing this (counts drift, the behaviour does not):
  # status=completed → 206 runs, status=success → 52, status=failure → 153.
  # There is no `conclusion=` parameter — passing one returns the unfiltered 206,
  # which is exactly how a typo would quietly reinstate the bug, so keep the
  # spelling as `status=success`. (An unrecognised *value* is safe the other way:
  # `status=bogus` returns 0 runs, i.e. "never skip".)
  #
  # Scoped by `head_sha` rather than "is the newest green run mine?" so the
  # question asked is literally the guarantee we want to make: has THIS commit
  # passed? No ordering assumptions, one request.
  #
  # Note a skipped firing is itself recorded as a green run on this sha, so it
  # matches the query too. That is sound rather than circular: the first skip on
  # a commit needs a green run to exist, and only a real execution can create
  # the first one. (The one exception is the runs from before this fix — the 9
  # green skips already on record for f462c89 — which is harmless because a
  # scheduled run only ever sees the branch tip.)
  gate:
    name: Skip if this commit already passed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Look for a green run on this commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          SHORT="${SHA:0:7}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch — always run"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "### Running the full suite on \`$SHORT\` (manual dispatch)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `// empty` prints nothing for an empty result set, and a failing gh
          # call falls back to the same empty string: an unreachable API means
          # "no green run known", i.e. run the suite. The gate fails open.
          green=$(gh api \
            "repos/$REPO/actions/workflows/e2e-full.yml/runs?branch=$BRANCH&head_sha=$SHA&status=success&per_page=1" \
            --jq '.workflow_runs[0].html_url // empty' 2>/dev/null || echo "")
          if [ -n "$green" ]; then
            echo "$SHORT already has a green run ($green) — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped — \`$SHORT\` already passed"
              echo
              echo "No new commit on \`$BRANCH\`, and the full suite is already green on this one:"
              echo
              echo "- deferring to $green"
              echo
              echo "**No tests ran in this run.** The green check on it means *deferred*, not *passed*."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no green run recorded for $SHORT — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Running the full suite on \`$SHORT\`"
              echo
              echo "No green run is on record for this commit — it has either never been"
              echo "tested, or the last attempt on it was red."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e-full:
    name: Playwright full (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: internship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/internship_test"
      NODE_OPTIONS: --max-old-space-size=8192
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3000"
      # Seeded admin used by the smoke tests
      SEED_ADMIN_EMAIL: "admin@example.com"
      SEED_ADMIN_PASSWORD: "ChangeMe123!"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "ChangeMe123!"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release dates come from git history; a shallow clone leaves every pending
          # release undated and the release-notes specs find no date (#2829, #2750).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema
        run: npx prisma db push

      - name: Seed admin user
        run: npx prisma db seed

      - name: Build app
        run: npm run build
        # Keep the Next.js build worker above its default ~2 GiB heap limit.
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The extra json reporter feeds the summary email below; list+html match
      # what the config would produce on CI.
      - name: Run full E2E suite (shard ${{ matrix.shard }}/4)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results-shard-${{ matrix.shard }}.json
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-full-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload JSON result (for the summary email)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-json-shard-${{ matrix.shard }}
          path: e2e-results-shard-${{ matrix.shard }}.json
          retention-days: 7
          # A shard that crashed before the tests writes no JSON; the report job
          # detects the gap via E2E_EXPECTED_REPORTS instead.
          if-no-files-found: warn

  # The `isolation` Playwright project (#1566), which no other gate runs.
  #
  # It cannot join the sharded job above: it needs its own Next server, booted
  # with MT_ENFORCE_ISOLATION=true, and playwright.config.ts deliberately
  # refuses to assemble both projects in one run (two servers compiling into the
  # same .next/). The PR gate can't run it either — that gate is the @smoke
  # subset and these specs are excluded from the default project. So it rides
  # along here: same 4×/day cadence, same drift gate, and its JSON report is
  # named `e2e-json-shard-isolation` so the summary email below picks it up like
  # any other shard (a red isolation run therefore mails, and a crash that
  # writes no report is caught by E2E_EXPECTED_REPORTS).
  isolation:
    name: Playwright tenant isolation
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.run == 'true'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: internship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/internship_test"
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
      NODE_OPTIONS: --max-old-space-size=8192
      # The isolation webServer overrides this to its own origin (port 3010);
      # left at the default, NextAuth's post-sign-in redirect walks off it.
      NEXTAUTH_URL: "http://localhost:3010"
      SEED_ADMIN_EMAIL: "admin@example.com"
      SEED_ADMIN_PASSWORD: "ChangeMe123!"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "ChangeMe123!"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema
        run: npx prisma db push

      - name: Seed admin user
        run: npx prisma db seed

      - name: Build app
        run: npm run build
        # Keep the Next.js build worker above its default ~2 GiB heap limit.
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the isolation project
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results-shard-isolation.json
        run: npx playwright test --project=isolation --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-isolation
          path: playwright-report/
          retention-days: 7

      - name: Upload JSON result (for the summary email)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-json-shard-isolation
          path: e2e-results-shard-isolation.json
          retention-days: 7
          if-no-files-found: warn

  # Single Turkish summary email for the whole run — red-only by default since
  # 2026-08-23 (maintainer request: the earlier every-run heartbeat became
  # noise). Aggregates the per-shard JSON reports; a shard that crashed before
  # writing its report is detected via E2E_EXPECTED_REPORTS and reported as
  # red. Set the repository variable E2E_REPORT_MODE=always to restore the
  # green heartbeat. Skipped entirely when the gate skipped the run.
  report:
    name: Summary email (red runs)
    runs-on: ubuntu-latest
    needs: [gate, e2e-full, isolation]
    if: always() && needs.gate.outputs.run == 'true'
    # issues: write is for the SMTP-free trail below (#2322); nothing else here
    # writes to the repository.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Before the issue step, so the issue can NAME the failing tests: it is the
      # only alert that reaches a person, and "see the artifacts" sent every
      # reader digging through four shard reports for the one line that matters.
      - name: Download per-shard JSON results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: e2e-json-shard-*
          path: e2e-json-reports
          merge-multiple: true

      - name: List the failing tests
        id: failing
        continue-on-error: true
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, appendFileSync } from "node:fs";
            const dir = "e2e-json-reports";
            let files = [];
            try { files = readdirSync(dir).filter((f) => f.endsWith(".json")); } catch {}
            const out = [];
            const walk = (suites, chain) => {
              for (const s of suites ?? []) {
                const next = s.title ? [...chain, s.title] : chain;
                for (const spec of s.specs ?? []) {
                  if (spec.ok !== false) continue;
                  const line = spec.line ? `:${spec.line}` : "";
                  out.push(`- \`${spec.file || s.file || "?"}${line}\` — ${[...next.slice(1), spec.title].join(" › ").replace(/[\r\n`]/g, " ").slice(0, 200)}`);
                }
                walk(s.suites, next);
              }
            };
            for (const f of files) {
              try { walk(JSON.parse(readFileSync(`${dir}/${f}`, "utf8")).suites, []); } catch {}
            }
            const list = out.length
              ? `Failing (${out.length}, after retries):\n${out.slice(0, 30).join("\n")}${out.length > 30 ? `\n- … and ${out.length - 30} more` : ""}`
              : `No failing test in the ${files.length} shard report(s) found — a shard may have crashed before writing one; see the run log.`;
            appendFileSync(process.env.GITHUB_OUTPUT, `list<<FAILING_EOF\n${list}\nFAILING_EOF\n`);
          '

      # The trail that reaches a person even when the e-mail below cannot
      # leave the runner (ETIMEDOUT on CONN, #2322): one `ci-alert` issue,
      # opened or refreshed while red, closed by the next green run. It runs
      # BEFORE the e-mail so a hanging SMTP connect cannot starve it. Best
      # effort by construction — the script never fails the job.
      - name: Record the result as an issue (no SMTP)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_KEY: e2e-full
          ALERT_SIGNATURE: ${{ github.sha }}
          ALERT_TITLE: '🚨 e2e-full (scheduled) is red'
          ALERT_SUMMARY: |
            Commit `${{ github.sha }}`. Shards: **${{ needs.e2e-full.result }}**, tenant isolation: **${{ needs.isolation.result }}**.
            ${{ steps.failing.outputs.list }}
            Errors and traces are in the run's `playwright-report-*` artifacts.
        run: node scripts/ci-alert-issue.mjs ${{ (needs.e2e-full.result == 'success' && needs.isolation.result == 'success') && 'green' || 'red' }}

      - name: Send summary email
        # Best effort (#2322): from a GitHub-hosted runner the SMTP connect
        # times out (~2 min, ETIMEDOUT on CONN), and the `ci-alert` issue is the
        # alert of record. Bounded, and never a second red job on top of it.
        timeout-minutes: 3
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || 'mehmetersahin@gmail.com' }}
          PLAYWRIGHT_JSON_REPORT: e2e-json-reports
          # 4 shards + the isolation job, each writing one JSON report.
          E2E_EXPECTED_REPORTS: '5'
          E2E_REPORT_MODE: ${{ vars.E2E_REPORT_MODE || 'failures' }}
          E2E_RUN_CONTEXT: 'e2e-full · ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |
          # Install from the lockfile so nodemailer matches the version the app
          # pins (single source of truth); skip postinstall (prisma generate).
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/e2e-report-email.mjs
