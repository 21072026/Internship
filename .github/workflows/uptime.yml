name: Uptime

# External uptime monitoring for the public environments (#2169).
#
# WHY IT IS NOT ON THE SERVER
#   It used to be: uptime-kuma ran on the same box it was watching. On
#   2026-09-03 that box went down and took the monitoring with it — the outage
#   ran for roughly 40 hours and nothing said so. A monitor that shares a
#   failure domain with its target reports "all good" right up until it cannot
#   report anything, which is worse than no monitor, because you believe it.
#
#   This runs on GitHub-hosted runners: different company, different network,
#   no shared dependency with the box other than the internet between them.
#
# WHAT IT DOES NOT DO — read this before trusting it as your only monitor.
#   GitHub's scheduled workflows are best-effort. `*/5` is the floor, not a
#   promise: runs are routinely 5-20 minutes late and can be dropped entirely
#   when the platform is busy. So this detects an outage within roughly a
#   quarter of an hour, not within a minute. That is fine for "the site has
#   been down since lunch" and useless for an SLA. A dedicated monitoring
#   service is the right tool if minute-level detection matters; this is the
#   zero-account, zero-third-party-ToS layer that works today.
#
# ALERTS ON STATE CHANGE, NOT ON EVERY FAILURE
#   A five-minute monitor that mails on every failed check sends twelve emails
#   an hour during an outage, and the next real alert arrives in a mailbox
#   people have learned to ignore. An open issue with the label below IS the
#   "currently alerting" state: it is created on the way down, closed on the way
#   back up, and each transition sends exactly one mail.
#
# TWO ALERT STATES, ONE PER FAILURE CLASS (#2579)
#   "A host does not answer" (`uptime-alert`) and "a marketing host answers
#   with the wrong product" (`uptime-content-alert`) are separate incidents
#   with separate issues and separate mails. They MUST NOT share one state: a
#   content problem can stay open for days waiting on an env-file edit, and if
#   it held the only alert state, a real outage of interncrm.com during those
#   days would find "already alerting" and stay silent — exactly the gap #2169
#   closed. A content finding on a host that is itself unreachable is left to
#   the outage alert, so one dead marketing host still opens ONE incident.
#
# THE MARKETING HOSTS COME FROM A SECRET (#2919)
#   Their URLs are the secret MARKETING_PROBE_URLS (whitespace- or
#   newline-separated, e.g. each marketing host's `/` and `/imprint`), never a
#   literal in this file and never a repository variable: a run log, the alert
#   issue and the mail are all readable by anyone who can read the repository,
#   and only secrets are masked in a log. For the same reason nothing below
#   prints one of those URLs: a marketing host is "marketing host #<n>", the
#   place of its origin among the distinct origins of the secret, in order. When
#   the secret is not set the marketing hosts are not probed at all, and the run
#   says so in a notice instead of failing. Such a run also neither opens nor
#   closes anything about them: the content state is `unknown` (no transition),
#   and an open outage that names a marketing host stays open, because pages
#   nobody read are not "right again".
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

# contents: read is for the two checkouts below: once a job names any
# permission, every one it does not name is `none`, checkout included.
permissions:
  contents: read
  issues: write

env:
  ALERT_LABEL: uptime-alert
  CONTENT_ALERT_LABEL: uptime-content-alert

jobs:
  check:
    name: Probe public environments
    runs-on: ubuntu-latest
    steps:
      # Just the one dependency-free script the content probe runs (#2579) —
      # a sparse checkout of a single file, NOT the full checkout + `npm ci`
      # further down, which only the rare transition run pays for. Into its
      # own directory so the mailer's full checkout later cannot collide.
      # continue-on-error: this step sits in front of the reachability probe,
      # and a failed fetch must not skip it. A missing script is not silent
      # either — probe_content turns it into a content finding.
      - name: Fetch the content probe
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          path: .content-probe
          sparse-checkout: scripts/marketing-content-probe.mjs
          sparse-checkout-cone-mode: false

      - name: Probe
        id: probe
        env:
          # Production first: it is the one whose failure matters most, and
          # listing it first makes the subject line read correctly.
          TARGETS: >-
            https://interncrm.com/api/health
            https://preview.interncrm.com/api/health
            https://demo.interncrm.com/api/health
          # The marketing hosts (#2540) are separate NAMES on the same
          # containers, so their /api/health adds exactly what the internship
          # host cannot tell you: that DNS, the certificate and the Caddy site
          # file for that name are alive. Each is on its own apex with its own
          # automatically-issued certificate, so an expiry or a deleted site
          # file takes only that name down — silently, until someone visits.
          # ...and /api/health cannot tell you WHICH PRODUCT a host shows: it is
          # the same JSON on every name the container serves. An empty
          # MARKETING_HOSTS once made the prod marketing domain serve the
          # internship landing (#2428) with this job green throughout. So the
          # marketing pages are also read (#2579; /imprint too, #2543, a
          # separate route that can go wrong on its own): each page's <title>
          # must contain the name in its host's own /manifest.webmanifest, and
          # that name must be neither "Internship CRM" nor the coreCRM fallback
          # (the brand is missing). The rule lives in
          # scripts/marketing-content-probe.mjs and its test. Both probes take
          # their URLs from this secret (see the header).
          MARKETING_PROBE_URLS: ${{ secrets.MARKETING_PROBE_URLS }}
          CONTENT_PROBE: .content-probe/scripts/marketing-content-probe.mjs
        run: |
          set -uo pipefail
          MARKETING_PROBE_URLS="${MARKETING_PROBE_URLS:-}"
          MARKETING_ON=1
          if [ -z "${MARKETING_PROBE_URLS//[[:space:]]/}" ]; then
            MARKETING_ON=0
            echo "::notice title=Marketing hosts not probed::The MARKETING_PROBE_URLS secret is not set, so this run checked neither the reachability nor the content of the marketing hosts."
          fi

          # The distinct origins of MARKETING_PROBE_URLS, one per line, in
          # order — the same key as originKey() in the content probe, so
          # "marketing host #<n>" means the same host in both probes.
          marketing_origins() {
            local url origin seen=$'\n'
            for url in $MARKETING_PROBE_URLS; do
              origin="$(printf '%s' "$url" | sed -E 's|^(https?://[^/?#]+).*|\1|' | tr '[:upper:]' '[:lower:]')"
              case "$seen" in *$'\n'"$origin"$'\n'*) continue ;; esac
              seen="${seen}${origin}"$'\n'
              printf '%s\n' "$origin"
            done
          }

          probe_all() {
            local failed="" n=0 origin
            for url in $TARGETS; do
              # `|| echo 000` here would APPEND to curl's own output: curl exits
              # non-zero on a connection failure but has already printed `000`,
              # so the code came out as "000000" in the alert. Let curl fail and
              # only substitute when it printed nothing at all.
              code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url" 2>/dev/null)" || true
              [ -n "$code" ] || code=000
              # 000 is curl's "never got an answer" — DNS, TLS or connection.
              # It is the shape a dead host takes, so it must not be treated as
              # just another non-200.
              if [ "$code" != "200" ]; then failed="${failed}${url} -> ${code}"$'\n'; fi
            done
            # A marketing host is named by its number, never by its URL.
            if [ "$MARKETING_ON" = 1 ]; then
              while IFS= read -r origin; do
                [ -n "$origin" ] || continue
                n=$((n + 1))
                code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${origin}/api/health" 2>/dev/null)" || true
                [ -n "$code" ] || code=000
                if [ "$code" != "200" ]; then failed="${failed}marketing host #${n} -> ${code}"$'\n'; fi
              done < <(marketing_origins)
            fi
            printf '%s' "$failed"
          }

          # One line per wrong page, nothing when every title is right. The
          # script reads MARKETING_PROBE_URLS itself, exits 1 on a finding and
          # its stdout is the detail (`marketing host #<h>, page #<p> -> …`);
          # its per-page OK/FAIL lines go to stderr, i.e. this log only. A run
          # it cannot explain itself (a crash, exit 2 = no targets) is still a
          # finding: a probe that silently stops probing is the failure mode
          # #2169 exists to rule out.
          probe_content() {
            local out rc
            [ "$MARKETING_ON" = 1 ] || return 0
            out="$(node "$CONTENT_PROBE")"; rc=$?
            if [ "$rc" -ne 0 ] && [ -z "$out" ]; then out="content probe exited $rc without a finding"; fi
            if [ -n "$out" ]; then printf '%s\n' "$out" | sed 's/^/wrong content: /'; fi
            return 0
          }

          # Content findings for a host that is not answering at all belong to
          # the outage alert, not to a second incident: drop them. Both probes
          # name the host by the same number ("marketing host #2 -> 000" there,
          # "marketing host #2, page #3 -> …" here).
          drop_unreachable_hosts() {
            local line host
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              host="$(printf '%s' "$line" | sed -nE 's/^wrong content: (marketing host #[0-9]+),.*/\1/p')"
              if [ -n "$host" ]; then
                case "$DOWN_PART" in *"${host} ->"*) continue ;; esac
              fi
              printf '%s\n' "$line"
            done
          }

          # Sets DOWN_PART (reachability) and CONTENT_PART (wrong page), each
          # the detail of its own alert. `$(…)` strips the trailing newline,
          # and it has to go back: the `detail<<EOF` blocks below need their
          # closing EOF on a line of its own, or the runner rejects the whole
          # output file ("Matching delimiter not found") and no alert step runs.
          probe_everything() {
            DOWN_PART="$(probe_all)"
            [ -z "$DOWN_PART" ] || DOWN_PART="${DOWN_PART}"$'\n'
            CONTENT_PART="$(probe_content | drop_unreachable_hosts)"
            [ -z "$CONTENT_PART" ] || CONTENT_PART="${CONTENT_PART}"$'\n'
          }

          probe_everything
          # One retry before declaring an outage. A single failed probe is
          # usually a deploy swapping containers or a transient network blip,
          # and paging on those is how a monitor gets muted. The content probe
          # is retried with it: mid-deploy a page can briefly be a 502.
          if [ -n "${DOWN_PART}${CONTENT_PART}" ]; then
            echo "first pass failed, retrying in 30s:"; printf '%s' "${DOWN_PART}${CONTENT_PART}"
            sleep 30
            probe_everything
          fi

          # One status + detail per alert class; each has its own state below.
          emit() { # <name> <detail>
            if [ -n "$2" ]; then
              echo "$1=down" >> "$GITHUB_OUTPUT"
              { echo "$1_detail<<EOF"; printf '%s' "$2"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
              printf '%s DOWN:\n%s' "$1" "$2"
            else
              echo "$1=up" >> "$GITHUB_OUTPUT"
              echo "$1 up"
            fi
          }
          emit reach "$DOWN_PART"
          # Without the secret nothing was read, and "nothing found" must not
          # read as "fixed": `unknown` is neither up nor down, so it opens and
          # closes nothing (an open content incident stays open, and no green
          # "the pages are right again" mail goes out for pages nobody read).
          if [ "$MARKETING_ON" = 1 ]; then
            emit content "$CONTENT_PART"
          else
            echo "content=unknown" >> "$GITHUB_OUTPUT"
            echo "content unknown (marketing hosts not probed)"
          fi
          echo "marketing=$([ "$MARKETING_ON" = 1 ] && echo on || echo off)" >> "$GITHUB_OUTPUT"

      - name: Find the current alert states
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pair in "reach_issue:$ALERT_LABEL" "content_issue:$CONTENT_ALERT_LABEL"; do
            NUM="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "${pair#*:}" \
                     --state open --limit 1 --json number --jq '.[0].number // ""')"
            echo "${pair%%:*}=${NUM}" >> "$GITHUB_OUTPUT"
            echo "open ${pair#*:} issue: ${NUM:-none}"
            # Whether an open outage names a marketing host: a run that did not
            # probe the marketing hosts cannot say that one is back.
            if [ "${pair%%:*}" = reach_issue ] && [ -n "$NUM" ]; then
              NAMES_MKT="$(gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json body \
                             --jq '.body | test("marketing host #")')"
              echo "reach_issue_marketing=${NAMES_MKT}" >> "$GITHUB_OUTPUT"
            fi
          done

      # ── the transitions, one state machine per alert class ───────────────
      # open  = down and not already alerting; close = up and we were alerting.
      # Anything else (still down, still up, `unknown`) is no transition and
      # sends nothing.
      - name: Open or close incidents
        id: transition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REACH: ${{ steps.probe.outputs.reach }}
          REACH_DETAIL: ${{ steps.probe.outputs.reach_detail }}
          REACH_ISSUE: ${{ steps.state.outputs.reach_issue }}
          REACH_ISSUE_MARKETING: ${{ steps.state.outputs.reach_issue_marketing }}
          MARKETING: ${{ steps.probe.outputs.marketing }}
          CONTENT: ${{ steps.probe.outputs.content }}
          CONTENT_DETAIL: ${{ steps.probe.outputs.content_detail }}
          CONTENT_ISSUE: ${{ steps.state.outputs.content_issue }}
        run: |
          set -euo pipefail
          # With the marketing hosts not probed, "reach up" covers only the
          # internship hosts. An open outage that names a marketing host stays
          # open until a run that read those hosts finds them answering again.
          if [ "$REACH" = up ] && [ "${MARKETING:-off}" != on ] && [ "${REACH_ISSUE_MARKETING:-}" = true ]; then
            echo "::notice title=Outage left open::The open outage names a marketing host, and this run did not probe the marketing hosts (MARKETING_PROBE_URLS is not set)."
            REACH=unknown
          fi
          # transition <name> <status> <open issue> <label> <title> <detail>
          transition() {
            local name="$1" status="$2" num="$3" label="$4" title="$5" detail="$6" body url
            if [ "$status" = down ] && [ -z "$num" ]; then
              gh label create "$label" --repo "$GITHUB_REPOSITORY" \
                --color B60205 --description "Automatic uptime alert" 2>/dev/null || true
              body="$(printf 'Automatic uptime check failed twice, 30 seconds apart.\n\n```\n%s```\n\nRun: %s/%s/actions/runs/%s\n\nThis issue is the alert state: it closes itself when the checks pass again.\n' \
                      "$detail" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
              url="$(gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
                      --title "$title" --body "$body")"
              echo "created $url"
              echo "${name}=open" >> "$GITHUB_OUTPUT"
              echo "${name}_url=${url}" >> "$GITHUB_OUTPUT"
              echo "any=true" >> "$GITHUB_OUTPUT"
            elif [ "$status" = up ] && [ -n "$num" ]; then
              gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
                --comment "Checks are passing again as of $(date -u '+%Y-%m-%d %H:%M UTC')."
              echo "closed #$num"
              echo "${name}=close" >> "$GITHUB_OUTPUT"
              echo "any=true" >> "$GITHUB_OUTPUT"
            fi
          }
          transition reach "$REACH" "$REACH_ISSUE" "$ALERT_LABEL" \
            "🔴 Site erişilemiyor" "$REACH_DETAIL"
          transition content "$CONTENT" "$CONTENT_ISSUE" "$CONTENT_ALERT_LABEL" \
            "🔴 Marketing host yanlış ürünü gösteriyor" "$CONTENT_DETAIL"

      # Mail only on transitions. Checkout + npm ci cost ~40s, which is why
      # they are here and not at the top: the overwhelmingly common case is a
      # green check that needs neither.
      - name: Checkout for the mailer
        if: steps.transition.outputs.any == 'true'
        uses: actions/checkout@v7

      - name: Install mailer deps
        if: steps.transition.outputs.any == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Email the transitions
        # Best effort (#2322): from a GitHub-hosted runner the SMTP connect
        # times out (~2 min, ETIMEDOUT on CONN), and the `ci-alert` issue is the
        # alert of record. Bounded, and never a second red job on top of it.
        timeout-minutes: 3
        continue-on-error: true
        if: steps.transition.outputs.any == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          REACH_T: ${{ steps.transition.outputs.reach }}
          REACH_URL: ${{ steps.transition.outputs.reach_url }}
          REACH_DETAIL: ${{ steps.probe.outputs.reach_detail }}
          CONTENT_T: ${{ steps.transition.outputs.content }}
          CONTENT_URL: ${{ steps.transition.outputs.content_url }}
          CONTENT_DETAIL: ${{ steps.probe.outputs.content_detail }}
        run: |
          set -euo pipefail
          # One mail per transition; both can happen in the same run. A failed
          # first mail must not swallow the second, so failures are collected
          # and the step fails at the end.
          rc=0
          send() { ALERT_SUBJECT="$1" ALERT_BODY="$2" node scripts/send-alert-email.mjs || rc=1; }
          case "${REACH_T:-}" in
            open)  send "🔴 InternCRM erişilemiyor" \
                     "$(printf 'Otomatik uptime kontrolü 30 saniye arayla iki kez başarısız oldu.\n\n%s\nOlay kaydı: %s\n' "$REACH_DETAIL" "$REACH_URL")" ;;
            close) send "🟢 InternCRM tekrar erişilebilir" \
                     "Bütün adresler yeniden 200 dönüyor. Erişim olay kaydı kapatıldı." ;;
          esac
          case "${CONTENT_T:-}" in
            open)  send "🔴 Marketing host yanlış ürünü gösteriyor" \
                     "$(printf 'Bir marketing sayfasının <title> etiketi kendi host adresinin manifest adını içermiyor ya da o ad Internship CRM veya coreCRM (30 saniye arayla iki kez). Host numaraları, MARKETING_PROBE_URLS secret içindeki sıradır.\n\n%s\nOlay kaydı: %s\nİlk bakılacak yer: MARKETING_HOSTS ve o host için ayarlı marka (infra/README.md § The marketing hosts).\n' "$CONTENT_DETAIL" "$CONTENT_URL")" ;;
            close) send "🟢 Marketing host yeniden doğru ürünü gösteriyor" \
                     "Marketing sayfalarının başlıkları yeniden doğru. İçerik olay kaydı kapatıldı." ;;
          esac
          exit "$rc"
