name: CI

on:
  # Re-enabled 2026-07-21 after the repo transfer reset the Actions quota
  # (clean 2000h/month). PR gate is cheap (~2 min); the heavy scheduled
  # workflows (e2e-full, stress, topic-preview) stay workflow_dispatch-only to
  # keep the monthly budget comfortable.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      # Prisma client instantiates lazily; build never connects, but a valid-format URL is required.
      DATABASE_URL: 'mysql://user:pass@127.0.0.1:3306/db'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the release gate below dates each pending change from
          # the commit that added its fragment, which a shallow clone hides
          # (#1457). The repo's history is small — this costs a second.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: i18n parity (EN/TR/DE)
        run: npm run check:i18n
      # The starter skill vocabulary is the thing every skill filter will
      # normalise to, and every way of breaking it is invisible to TypeScript:
      # the fields are all `string`, so a duplicated key, an alias two skills
      # both claim, an adjacency pointing at a renamed key or an empty Turkish
      # label all compile. They surface as a picker with two "React" rows or a
      # lookup that resolves to whichever entry came first (#1816).
      - name: skill vocabulary is well-formed (#1816)
        run: npm run check:skills
      # …and the behaviour the data exists for: the four spellings of one skill
      # collapsing to one key, and adjacency authored one-way coming out
      # symmetric.
      - name: skill vocabulary index (#1816)
        run: npm run test:skill-vocabulary
      # A hardcoded stage key ('HIRED_660', …) type-checks, passes every test on
      # the default seed, and only misbehaves for a tenant that renamed its
      # stages — which no test tenant does. That invisibility is why the bug
      # keeps coming back (#1880); the guard makes a new one a red build.
      - name: no hardcoded pipeline stage keys (#1886)
        run: npm run check:stage-keys
      # A malformed release fragment must fail in the PR that adds it, not in
      # next.config.js during the deploy build (#1275).
      - name: release fragments are well-formed (#1275)
        run: npm run check:release-fragments
      # The version arithmetic runs in three places that must agree (build, this
      # gate, compaction). When they silently disagreed, three merges in a row
      # shipped under one version number and 45 changes were buried in a single
      # changelog section (#1457).
      - name: release version arithmetic (#1457)
        run: npm run test:release
      # The analytics aging card printed "N candidates" for a number that
      # counts completed stage transitions, so one page reported two different
      # figures for the same stage (#1427). Nothing typechecks that meaning —
      # these assertions do.
      - name: time-in-stage counts visits and candidates separately (#1427)
        run: npm run test:stage-aging
      # "Who accessed my account" prints factual claims about who entered the
      # reader's account and how the visit ended. An unclosed start five minutes
      # old and one five hours old are the same two columns in the database and
      # mean opposite things; no e2e run can hold the clock still across that
      # boundary, so the three outcomes are pinned here (#1587).
      - name: impersonation history states only what the rows prove (#1587)
        run: npm run test:impersonation-history
      # The mentor directory's scan cap is only reachable with 2000+ consented
      # mentors, so no e2e run ever drives the `partial` branch. A complete
      # answer that claims to be truncated is as wrong as a truncated one that
      # claims to be complete (#1820).
      - name: mentor directory reports a truncated scan exactly (#1820)
        run: npm run test:mentor-directory
      # Rate limits are a security control on ~30 endpoints, and both ways of
      # getting the shared store wrong are invisible in a browser: counting
      # per-process again (every limit doubles per replica) or letting a store
      # outage reach the caller (nobody signs in). These assertions are the only
      # thing that looks (#1696).
      - name: rate limits are shared, and fall back safely (#1696)
        run: npm run test:rate-limit-store
      # src/lib/roi.ts is the one ROI implementation in the tree — the admin
      # report and the public calculator both compute through it, so a wrong
      # number reaches a prospect's browser. Money arithmetic typechecks
      # perfectly while being wrong: a coaching relation counted as a hire, a
      # division by zero rendered as Infinity, two currencies silently added
      # (#1892).
      - name: the ROI model is deterministic and refuses to guess (#1892)
        run: npm run test:roi
      # src/lib/plans.ts is the single source of what each plan sells and what
      # it costs, and every way of getting it wrong typechecks: an unknown plan
      # key resolving to "everything" gives the paid product away, a cancelled
      # subscription that keeps its limits is a customer who stopped paying and
      # noticed nothing, and the legacy FREE/PRO/ENTERPRISE translation exists
      # twice (TypeScript + the deploy backfill, which runs as plain node) so
      # the two can silently disagree (#1731).
      - name: the plan → feature matrix and its fallbacks (#1731)
        run: npm run test:plans
      # src/lib/money.ts is the ONLY place a currency symbol is written, which
      # is what lets the pricing page carry no currency literal of its own. So
      # every bug in it is a wrong number on a public page, in a locale the
      # author probably does not read: the group and decimal separators are
      # swapped between en and tr/de (€1,20 read as English is €120), the symbol
      # changes side, and the module is hand-rolled rather than Intl precisely
      # because ICU builds disagree — which only a test pinning exact strings
      # keeps honest (#1730).
      - name: money and percent formatting in all three locales (#1730)
        run: npm run test:money
      - name: auth path reads only the columns it needs (#1150)
        run: npm run check:auth-reads
      # An API-key request has no session, so nothing resolves a tenant for it
      # and the tenant middleware treats that as "do not scope": a /api/v1 route
      # that authenticates a key and then queries reads every organisation's
      # rows while looking ordinary (#1546). withApiKey() is the one door where
      # expiry, revocation, scope and the org binding are decided; this keeps
      # every route behind it.
      - name: the public API is entered through one door (#1546)
        run: npm run check:api-key-routes
      # MentorApplication.adminNote is private admin commentary; an e-mail
      # template that rendered it would show an applicant what an admin wrote
      # about them. Nothing in the type system says so, so a file-level guard
      # does (#1806).
      - name: no e-mail template can read a private admin note (#1806)
        run: npm run test:note-privacy
      # Prisma's filter grammar is data: an object where a scalar id belongs is
      # read as an operator, so a raw request body in a `where` turns an equality
      # lookup into a different query. The tree is clean; this keeps it that way.
      - name: no unvalidated request body in a Prisma filter
        run: npm run check:query-scalars
      # A model that carries `orgId` but is missing from TENANT_MODELS is a
      # silent pass-through: the tenant middleware never matches it, so the row
      # only *looks* scoped and is protected by whatever `where` clause a
      # developer remembered to write. The registry drifted once and eight
      # models stayed unprotected for months (#1560). Checked in both
      # directions — a typo'd entry never matches anything either.
      - name: every orgId model is registered with the tenant middleware (#1560)
        run: npm run check:tenant-models
      # `prisma db push` does not merely warn about some schema steps, it
      # REFUSES them on a table that already has rows — and `--accept-data-loss`
      # does not cover that class. #2249 added `Setting.id String @id
      # @default(cuid())`, which is additive in the schema, legal against the
      # fresh database every topic env pushes to (#1185), and stalled every prod
      # and preview deploy for 13 commits. Nothing the author could look at was
      # red. This diffs the schema against the merge-base and names the step
      # (#2298). It needs history: the checkout above is `fetch-depth: 0`, and
      # the check FAILS CLOSED if it cannot resolve a base — "no base" must
      # never read as "no problem". Its own assertions run under `npm run
      # test:unit` (scripts/test/schema-push-safety.test.mjs).
      - name: no schema step `db push` would refuse on a populated table (#2298)
        env:
          # The base commit GitHub itself resolved for this PR, so the check
          # never has to guess which ref to diff against (empty on a push to
          # main, where it falls back to origin/main and finds no diff).
          SCHEMA_PUSH_SAFETY_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check:schema-push
      # `toLocaleDateString()` with no argument formats in the BROWSER's
      # language, so a fully-Turkish screen printed 8/25/2026 and an interview
      # slot carried no timezone at all (#1422). The tree is clean; this stops
      # the next call site from re-introducing it.
      - name: dates are formatted on the app locale, not the browser's (#1422)
        run: npm run check:locale-dates
      # Tailwind's mid shades are picked to look good, not to clear 4.5:1 under
      # white: amber-500 is 2.15:1 and green-600 3.30:1. Fourteen buttons and
      # unread badges had drifted onto them without the e2e accessibility gate
      # ever going red, because that gate runs AFTER the smoke step — on a job
      # whose smoke step fails it never runs at all. This is the cheap static
      # half, deliberately outside Playwright so nothing upstream can skip it
      # (#1299). Its own too-narrow/too-broad assertions run under
      # `npm run test:unit` (scripts/test/contrast-guard.test.mjs).
      - name: white text sits on a surface dark enough for it (#1299)
        run: npm run check:contrast
      - name: the contrast guard still catches what it is for (#1299)
        run: npm run test:contrast-guard
      # A renamed route would silently drop out of the demo's write blocklist,
      # re-enabling password changes and uploads on the public demo (#966).
      - name: demo write blocklist still matches the routes (#966)
        run: npm run check:demo-blocklist
      # `dispatchWebhook()` posts from inside whichever handler noticed the
      # change, so every direct caller is a place the next cross-cutting concern
      # (the durable queue, a DomainEvent row, tenant scoping, the audit trail)
      # silently does not apply. Ten call sites do that today and are listed in
      # the script by file and count; this caps it at ten — an eleventh direct
      # call is a red build, including a second one in a file already on the
      # list, and `deliverToWebhook()` is scanned as the same door (#1697).
      - name: an event leaves through one door (#1697)
        run: npm run check:events
      # Nothing else in CI looks at k6/: `next lint` only visits src/, and
      # tsconfig's include lists only *.ts|tsx. Without this, a typo in a k6
      # script is first seen at 23:40 UTC when the nightly cron fires (#1449).
      # `k6 archive` bundles and evaluates the init context — catching syntax
      # errors, bad imports and thresholds naming a non-existent metric —
      # without issuing a single request.
      - name: Install k6 (for the k6 script parse check)
        env:
          K6_VERSION: v1.8.1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/k6"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --retry-delay 5 -o "$dir/k6.tgz" \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$dir/k6.tgz" --strip-components=1 -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
      - name: k6 load scripts parse (#1449)
        env:
          K6_CHECK_REQUIRED: '1'
        run: npm run check:k6
      # The admin API explorer publishes what scripts/openapi-generate.cjs
      # derives from src/app/api. A static analyser degrades silently: a route
      # in a shape it does not recognise simply vanishes from the document, and
      # a guard it cannot follow used to render as "no credential required".
      # This re-derives the spec and fails on a dropped route, a duplicate
      # operationId, an /api/admin endpoint that does not resolve to an ADMIN
      # guard, leaked redacted comment text, or non-deterministic output. It is
      # a guard, NOT a prerequisite for the steps above: nothing under src/
      # imports the generated file - next.config.js inlines the document via
      # env at build time - so lint and tsc do not depend on codegen having run
      # (which is also why there is no prebuild hook: `npm start` in the
      # production container has no src/ to scan).
      - name: generated API description is complete and honest
        run: npm run check:openapi
      # Manifest hygiene, without a database: every entry well-formed and every
      # `model` a real Prisma model. A typo there would count nothing and pass
      # silently, so it is worth catching in the fast job too.
      - name: demo fidelity manifest is well-formed (#2063)
        run: npm run check:demo-fidelity -- --manifest-only
      # The deploy scripts never run in CI, so their one piece of decision logic
      # — "is this dump real?" — had no coverage at all until it broke prod
      # (#1200). Cheap to run here; the alternative is finding out on the server.
      - name: backup dump validation (#1200)
        run: bash infra/test/backup-db.test.sh
      # Same reasoning for the destructive-schema gate: it only ever runs on the
      # server mid-deploy, and being too broad is as costly as being too narrow
      # — it silently stops prod from deploying at all (#1230).
      - name: schema guard pattern (#1230)
        run: bash infra/test/schema-guard.test.sh
      # The predicate that keeps demo rows off prod is now shared between the
      # seeder and the fidelity checker (prisma/demoTarget.mjs); a regression
      # that made it permissive would be invisible until it mattered.
      - name: demo seed target guard (#2063)
        run: node scripts/test/demo-target.test.mjs
      # reset-demo.mjs truncates every table in the database it is given; the
      # only thing keeping it off prod is the name check at the top (#966).
      - name: demo reset guard (#966)
        run: bash infra/test/reset-demo-guard.test.sh
      # The MySQL watchdog only ever runs on the box at the moment the database
      # is already down, so its two decisions — "is this server alive?" and
      # "should I restart it?" — get their coverage here instead. A probe that
      # mistakes a healthy "Access denied" for a dead server would restart prod's
      # database every minute.
      - name: mysql watchdog probe logic
        run: bash infra/test/mysql-watchdog.test.sh
      # The rolling two-replica deploy (#1701) has the same problem: it only
      # runs on the server against docker, and its two load-bearing claims —
      # replica 1 keeps the historical name/port, and REPLICAS=1 generates the
      # same single-upstream routing bootstrap.sh writes — are the kind that
      # quietly stop being true.
      - name: replica rollout arithmetic + generated routing (#1701)
        run: bash infra/test/replica-rollout.test.sh
      # The steps above each run ONE unit suite because each was added by the
      # incident it names. Nothing held the set together, so a suite whose rule
      # got refactored away could lose its assertions and stay green — the test
      # that would have failed no longer exists (#1599). This runs every
      # scripts/test/*.test.mjs under Node's own coverage and holds each covered
      # module to a per-file LINE floor. Per-file on purpose: a repo-wide
      # percentage moves when unrelated code lands, so it is a number nobody
      # acts on and can only ever be argued down (#1591). Floors are the value
      # measured on main, rounded down — green on day one, and they only ever go
      # up (docs/testing.md § The coverage ratchet). The table lands in the job
      # summary, so a reviewer sees where each module stands without opening the
      # log.
      - name: unit tests + per-module coverage floor (#1599)
        run: npm run test:unit:coverage
      - run: npm run build

  # The demo seed is the only data most people ever see: the public demo, every
  # per-PR topic environment, and every new contributor's local box. When a
  # feature ships without a corresponding seed block, its screen renders
  # perfectly — and empty — everywhere, and nothing goes red. This job seeds a
  # throwaway MySQL from scratch and counts the rows behind each differentiating
  # screen against scripts/demo-fidelity.json (#2063).
  #
  # Its own job rather than a step in `checks`: it needs a database service that
  # the lint/typecheck job has no use for, and running in parallel keeps it off
  # the critical path (no `npm run build` here — it never renders a page).
  demo-fidelity:
    name: Demo seed fidelity
    runs-on: ubuntu-latest

    # Same service block as the Playwright gate (.github/workflows/e2e.yml) —
    # deliberately identical so the two agree about what a fresh CI database is.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: internship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/internship_test'
      NEXTAUTH_SECRET: 'ci-test-secret-not-for-production'
      NEXTAUTH_URL: 'http://localhost:3000'
      SEED_ADMIN_EMAIL: 'admin@example.com'
      SEED_ADMIN_PASSWORD: 'ChangeMe123!'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply DB schema
        run: npx prisma db push
      - name: Seed first admin
        run: npx prisma db seed
      - name: Seed demo data
        run: npm run seed:demo
      - name: Every differentiating screen has demo data behind it (#2063)
        run: npm run check:demo-fidelity
