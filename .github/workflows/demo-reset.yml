name: Reset the public demo

# Wipes and re-seeds the public demo database (#966) so each visitor starts from
# the same synthetic dataset, and nothing one visitor typed sticks around for the
# next one.
#
# WHY THIS IS A WORKFLOW AND NOT AN ENDPOINT
#   The reset is destructive, so it stays off the public internet entirely:
#   no /api/demo/reset, no shared secret in an env file, no route that could be
#   aimed at the wrong database. The self-hosted runner already has the access it
#   needs, and prisma/reset-demo.mjs refuses any database whose name does not end
#   in `_demo` (covered by infra/test/reset-demo-guard.test.sh in CI).
#
# SERVER PREREQUISITES (see docs/DEMO.md)
#   - the demo container `internship-crm-demo` is running
#   - /etc/internship-crm/demo.env has DATABASE_URL pointing at
#     internship_crm_demo, plus DEMO_MODE=true
#
# The steps themselves live in infra/server/demo-refresh.sh, which the preview
# deploy also calls (#1249) — one implementation for "make the demo current",
# whether that means new data or a new image.

on:
  schedule:
    # 02:00 and 14:00 UTC — twice a day is enough to clear drift without
    # yanking the data out from under someone mid-click.
    - cron: '0 2,14 * * *'
  workflow_dispatch:

concurrency:
  # Never let two resets interleave: the second would truncate tables the first
  # is still re-seeding, and the demo would be left half-populated.
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Wipe + re-seed the demo database
    runs-on: self-hosted
    steps:
      - name: Fetch the repo (no action download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -d .git ] || git init -q .
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          git -c credential.helper="$HELPER" fetch --no-tags --depth=1 origin "$FETCH_REF"
          git checkout -q --force --detach FETCH_HEAD
          git clean -qfdx

      - name: Reset
        run: |
          set -euo pipefail
          chmod +x infra/server/demo-refresh.sh
          # Same script the preview deploy calls with --image (#1249). One
          # implementation, so the twice-daily reset and the redeploy cannot
          # drift into doing different things to the same environment.
          ./infra/server/demo-refresh.sh --data-only
