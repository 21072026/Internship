name: E2E Tests

on:
  # The @smoke-only PR gate. The full suite runs once a day in e2e-full.yml.
  # A manual run takes an optional Playwright --grep filter, so a single
  # non-smoke spec can be re-verified on a branch without dispatching the whole
  # 4-shard e2e-full suite (which also emails a summary on every run).
  workflow_dispatch:
    inputs:
      grep:
        description: 'Playwright --grep filter (e.g. @smoke, or a test title)'
        required: false
        default: '@smoke'
  # PR-only since 2026-10-14 (#2917): no `push: main`. That run re-tested the
  # diff its PR had just passed, ~6,400 metered minutes a month, and nothing
  # waited for it — the deploy starts on the same push. Two PRs green alone
  # and red together still surface: the next PR's run tests itself merged into
  # the new main, and the daily e2e-full run tests main. It used to be the only
  # writer of the Next.js build cache PR runs restore; e2e-full saves it now.
  # No `paths-ignore` here on purpose (#2719). `Playwright smoke` is a REQUIRED
  # check on `main`, and a workflow skipped by a path filter reports nothing at
  # all — so a docs-only PR sat BLOCKED with every check green, and only an
  # admin bypass could merge it (#2608, #2670, #2626). The workflow now always
  # runs; the `changes` job below decides whether the smoke job has anything
  # to test, and a job skipped by its `if:` reports Success to branch
  # protection.
  # Since 2026-10 the repo is private on the Free plan, where branch protection
  # is not enforced (the API answers 403), so "required" is a convention and
  # nothing blocks a red merge (#2910). The design above stays, so the gate
  # works again the day protection does.
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the gate stays fast.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this PR change anything the smoke suite could notice? The paths that
  # don't count are the ones the old `paths-ignore` listed: docs/**,
  # releases/unreleased/**, any *.md, and root .HANDOFF-* notes. A rename counts
  # by BOTH names, so moving code into docs/ is still a code change. Every
  # event other than a PR (a manual dispatch) always tests.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Not a PR ($EVENT): smoke runs."; exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          ignored() {
            case "$1" in
              docs/*|releases/unreleased/*|*.md) return 0 ;;
              .HANDOFF-*) case "$1" in */*) return 1 ;; *) return 0 ;; esac ;;
            esac
            return 1
          }
          code=false
          # The files endpoint stops at 3000 entries; a list that long is
          # treated as a code change rather than trusted to be complete.
          [ "$count" -ge 3000 ] && code=true
          [ "$count" -eq 0 ] && code=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! ignored "$f"; then code=true; echo "Code change: $f"; break; fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$count path(s) examined; code=$code"

  # The smoke set and the accessibility gate, in ONE job, one after the other
  # (#2917).
  #
  # From #2811 they were three parallel jobs: smoke 1/2 and 2/2 (Playwright
  # `--shard` over the @smoke set) and a11y. Each one repeated ~4 min of
  # identical setup (MySQL service, `npm ci`, prisma, `next build`) before
  # ~2.7 min of tests. On metered minutes that setup was most of the bill,
  # ~3,700 minutes a month. In series the gate takes ~13 min wall-clock
  # instead of ~7. #2811's other cuts (no `--with-deps` font install, the
  # pruned ~107-test smoke set) stay.
  #
  # Each suite still sees exactly what it saw as a job of its own:
  #   - smoke runs unsharded, as it did before #2811: one `next start`, and
  #     `workers: 1` stays (specs share the seeded admin, rate-limit buckets and
  #     global rows, and were never written for concurrency on one DB).
  #   - the a11y baseline scan (e2e/a11y-scan.spec.ts) runs serially by design
  #     (its last test compares what every earlier test collected). It runs
  #     after smoke on a database reset to the freshly seeded state, against a
  #     `next start` of its own (every `playwright test` boots one, so the
  #     in-memory rate-limit counters start empty too). It runs even when smoke
  #     failed, so one red suite never hides the other's verdict.
  #
  # This job carries the REQUIRED check name itself again. Without a matrix it
  # is named `Playwright smoke`, which is the name branch protection matches,
  # so the aggregator job the matrix needed is gone too. A docs-only PR skips
  # it through the `if:` below, and a job skipped by its `if:` reports Success
  # to branch protection.
  smoke:
    name: Playwright smoke
    needs: changes
    # Runs unless the PR is docs-only. FAILS CLOSED: if `changes` errors, its
    # output is empty, which is not 'false', so the smoke runs instead of the
    # gate quietly passing. `!cancelled()` keeps a failed `changes` from
    # skipping this job the way an implicit `success()` would.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: internship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/internship_test"
      NODE_OPTIONS: --max-old-space-size=8192
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3000"
      # Seeded admin used by the smoke tests
      SEED_ADMIN_EMAIL: "admin@example.com"
      SEED_ADMIN_PASSWORD: "ChangeMe123!"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "ChangeMe123!"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema
        run: npx prisma db push

      - name: Seed admin user
        run: npx prisma db seed

      # Next's webpack cache. Restored here, SAVED by the daily e2e-full run on
      # main — so PR runs start from main's cache (a branch may read its base
      # branch's caches) without each PR push adding a few hundred MB to the
      # repo's 10 GB cache budget and evicting the npm/Playwright caches.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build app
        id: build
        run: npm run build
        # Keep the Next.js build worker above its default ~2 GiB heap limit.
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # The browser only — no `--with-deps`. On ubuntu-latest every shared
      # library Chromium needs is already installed (the runner image ships
      # Chrome); `--with-deps` added nothing but nine font packages (CJK, Thai,
      # X11 bitmap fonts) and spent ~4 min fetching them from the Azure apt
      # mirror on every run. No smoke spec compares screenshots, so glyph
      # fallback cannot change a result. The scheduled full suite
      # (e2e-full.yml) keeps `--with-deps` and therefore the full font set.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # PR gate runs the @smoke subset only (#623); the FULL suite runs once a
      # day via e2e-full.yml (sharded, email on failure) and on demand.
      # The filter is passed through an env var, not interpolated into the
      # shell — a dispatch input is untrusted text. `--pass-with-no-tests`
      # because a narrow manual grep (one test title) can match nothing, and
      # an empty run is not a failure.
      - name: Run E2E tests (smoke)
        env:
          E2E_GREP: ${{ inputs.grep || '@smoke' }}
        run: npx playwright test --grep "$E2E_GREP" --pass-with-no-tests

      # Uploaded before the a11y scan runs: the html reporter writes
      # playwright-report/ afresh on every `playwright test`.
      - name: Upload Playwright report (smoke)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

      # The a11y gate below runs on the database state it had as a job of its
      # own: schema pushed, admin seeded, nothing the smoke specs wrote.
      - name: Reset the database for the accessibility scan
        id: reset
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.grep }}
        run: |
          npx prisma db push --force-reset --skip-generate
          npx prisma db seed

      # The accessibility regression gate, run OUTSIDE the grep (#826).
      #
      # It exists because the gate shipped in #862 did not gate. The scan
      # carries no @smoke tag, and the smoke run filters on @smoke, so the
      # 9-page baseline comparison only ever ran in the scheduled suite — a PR
      # introducing a new serious violation sailed through. #1333 is that
      # failure mode realised.
      #
      # Kept out of the @smoke tag so the smoke set stays small and fast
      # (CLAUDE.md), while the gate still blocks the PR it is supposed to
      # block. Skipped when a manual run asked for a specific grep, because that
      # run is targeting something else on purpose.
      - name: Accessibility regression gate
        id: a11y
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: npx playwright test e2e/a11y-scan.spec.ts

      - name: Upload Playwright report (a11y)
        if: ${{ always() && steps.a11y.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7
