name: E2E Tests

on:
  # The @smoke-only PR gate. The full suite runs 4x a day in e2e-full.yml.
  # A manual run takes an optional Playwright --grep filter, so a single
  # non-smoke spec can be re-verified on a branch without dispatching the whole
  # 4-shard e2e-full suite (which also emails a summary on every run).
  workflow_dispatch:
    inputs:
      grep:
        description: 'Playwright --grep filter (e.g. @smoke, or a test title)'
        required: false
        default: '@smoke'
  push:
    branches: [main]
  # No `paths-ignore` here on purpose (#2719). `Playwright smoke` is a REQUIRED
  # check on `main`, and a workflow skipped by a path filter reports nothing at
  # all — so a docs-only PR sat BLOCKED with every check green, and only an
  # admin bypass could merge it (#2608, #2670, #2626). The workflow now always
  # runs; the `changes` job below decides whether the smoke job has anything
  # to test, and a job skipped by its `if:` reports Success to branch
  # protection.
  # Since 2026-10 the repo is private on the Free plan, where branch protection
  # is not enforced (the API answers 403), so "required" is a convention and
  # nothing blocks a red merge (#2910). The design above stays, so the gate
  # works again the day protection does.
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the gate stays fast.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this PR change anything the smoke suite could notice? The paths that
  # don't count are the ones the old `paths-ignore` listed: docs/**,
  # releases/unreleased/**, any *.md, and root .HANDOFF-* notes. A rename counts
  # by BOTH names, so moving code into docs/ is still a code change. Every
  # event other than a PR (push to main, a manual dispatch) always tests.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Not a PR ($EVENT): smoke runs."; exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          ignored() {
            case "$1" in
              docs/*|releases/unreleased/*|*.md) return 0 ;;
              .HANDOFF-*) case "$1" in */*) return 1 ;; *) return 0 ;; esac ;;
            esac
            return 1
          }
          code=false
          # The files endpoint stops at 3000 entries; a list that long is
          # treated as a code change rather than trusted to be complete.
          [ "$count" -ge 3000 ] && code=true
          [ "$count" -eq 0 ] && code=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! ignored "$f"; then code=true; echo "Code change: $f"; break; fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$count path(s) examined; code=$code"

  # The smoke set and the accessibility gate, run as PARALLEL jobs (#2811).
  #
  # Serially this job took ~19 min wall-clock: ~4 min installing CJK/Thai/X11
  # font packages from a slow apt mirror, 2.6 min building, 7.6 min for the
  # ~200 @smoke tests on one worker and 2.9 min for the a11y gate. The smoke
  # set was pruned back to critical flows + security guards (~107 tests, most
  # of them browserless unit specs), and the rest is split:
  #
  #   - smoke 1/2, 2/2: Playwright `--shard` over the @smoke set. Each shard is
  #     its own runner with its own MySQL service and its own `next start`, so
  #     the state isolation is exactly what one worker on one runner gave —
  #     `workers: 1` stays (specs share the seeded admin, rate-limit buckets and
  #     global rows, and were never written for concurrency on one DB).
  #   - a11y: the serial baseline scan (e2e/a11y-scan.spec.ts) cannot be
  #     sharded — its last test compares what every earlier test collected — so
  #     it is a job of its own and, at ~3 min, the one that sets the pace.
  #
  # The REQUIRED check is the `Playwright smoke` job at the bottom, which only
  # aggregates these. Branch protection matches check names literally, and a
  # matrix job is named `Playwright smoke (…)`, never `Playwright smoke`.
  e2e:
    name: Playwright smoke (${{ matrix.label }})
    needs: changes
    # Runs unless the PR is docs-only. FAILS CLOSED: if `changes` errors, its
    # output is empty, which is not 'false', so the smoke runs instead of the
    # gate quietly passing. `!cancelled()` keeps a failed `changes` from
    # skipping this job the way an implicit `success()` would.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # One red shard should not cancel the others: the report of every shard
      # is what tells you whether it is one flaky spec or a real break.
      fail-fast: false
      matrix:
        include:
          - { label: 'smoke 1/2', suite: smoke, shard: '1/2' }
          - { label: 'smoke 2/2', suite: smoke, shard: '2/2' }
          - { label: 'a11y', suite: a11y, shard: '' }

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: internship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/internship_test"
      NODE_OPTIONS: --max-old-space-size=8192
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3000"
      # Seeded admin used by the smoke tests
      SEED_ADMIN_EMAIL: "admin@example.com"
      SEED_ADMIN_PASSWORD: "ChangeMe123!"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "ChangeMe123!"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema
        run: npx prisma db push

      - name: Seed admin user
        run: npx prisma db seed

      # Next's webpack cache. Restored on every run, SAVED only by the push to
      # main — so PR runs start from main's cache (a branch may read its base
      # branch's caches) without each PR push adding a few hundred MB to the
      # repo's 10 GB cache budget and evicting the npm/Playwright caches.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build app
        run: npm run build
        # Keep the Next.js build worker above its default ~2 GiB heap limit.
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Save Next.js build cache
        if: ${{ github.event_name == 'push' && matrix.shard == '1/2' }}
        uses: actions/cache/save@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # The browser only — no `--with-deps`. On ubuntu-latest every shared
      # library Chromium needs is already installed (the runner image ships
      # Chrome); `--with-deps` added nothing but nine font packages (CJK, Thai,
      # X11 bitmap fonts) and spent ~4 min fetching them from the Azure apt
      # mirror on every run. No smoke spec compares screenshots, so glyph
      # fallback cannot change a result. The scheduled full suite
      # (e2e-full.yml) keeps `--with-deps` and therefore the full font set.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # PR gate runs the @smoke subset only (#623); the FULL suite runs 4x a
      # day via e2e-full.yml (sharded, email on failure) and on demand.
      # The filter is passed through an env var, not interpolated into the
      # shell — a dispatch input is untrusted text. `--pass-with-no-tests`
      # because a narrow manual grep (one test title) leaves most shards empty,
      # and an empty shard is not a failure.
      - name: Run E2E tests (${{ matrix.label }})
        if: ${{ matrix.suite == 'smoke' }}
        env:
          E2E_GREP: ${{ inputs.grep || '@smoke' }}
          E2E_SHARD: ${{ matrix.shard }}
        run: npx playwright test --grep "$E2E_GREP" --shard="$E2E_SHARD" --pass-with-no-tests

      # The accessibility regression gate, run OUTSIDE the grep (#826).
      #
      # This job exists because the gate shipped in #862 did not gate. The scan
      # carries no @smoke tag, and the smoke shards filter on @smoke, so the
      # 9-page baseline comparison only ever ran in the scheduled suite — a PR
      # introducing a new serious violation sailed through. #1333 is that
      # failure mode realised.
      #
      # Kept out of the @smoke tag so the smoke set stays small and fast
      # (CLAUDE.md), while the gate still blocks the PR it is supposed to
      # block. Skipped when a manual run asked for a specific grep, because that
      # run is targeting something else on purpose.
      - name: Accessibility regression gate
        if: ${{ matrix.suite == 'a11y' && !inputs.grep }}
        run: npx playwright test e2e/a11y-scan.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 7

  # The REQUIRED check. Green when every shard above is green, and when the PR
  # is docs-only and the shards were skipped on purpose (`changes` said
  # code=false) — the same outcome the single skipped job used to report.
  # Anything else is red: a failed or cancelled shard, and a shard skipped for
  # any OTHER reason (fails closed, like the `if:` above).
  smoke:
    name: Playwright smoke
    needs: [changes, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.e2e.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "shards: $RESULT, code change: ${CODE:-unknown}"
          if [ "$RESULT" = "success" ]; then exit 0; fi
          if [ "$RESULT" = "skipped" ] && [ "$CODE" = "false" ]; then
            echo "Docs-only PR: nothing for the smoke suite to test."; exit 0
          fi
          exit 1
