name: Deploy prod (hosted build → server swap, auto on main)

# Production deploy. The IMAGE IS BUILT ON A GITHUB-HOSTED RUNNER (build-image.yml)
# and pushed to ghcr; the Plesk server only pulls it and swaps the container.
#
# HISTORY (why it looks like this):
#   #636  the whole deploy moved onto a self-hosted runner ON THE SERVER because
#         the private repo's hosted Actions quota was exhausted. That made the
#         production box run `npm ci` + `next build` for every merge.
#   #800  it became automatic instead of dispatch-only (44 manual dispatches in a
#         row is not a pipeline).
#   now   the repo is PUBLIC, so hosted runners are free and unmetered again. The
#         build goes back to GitHub; the self-hosted runner keeps only the work
#         that genuinely has to happen on the server — reading the live health
#         endpoint, `docker pull`, `prisma db push`, the container swap. Nothing
#         on the box compiles anymore.
#
# HOW IT TRIGGERS:
#   push to main   → deploy (the normal path; PRs already passed the smoke gate
#                    in e2e.yml before they could merge)
#   every 6 hours  → deploy ONLY if prod drifted from origin/main; the
#                    self-hosted runner can be offline when a push arrives (see
#                    runner-watchdog.yml) and that deploy would otherwise be lost
#                    silently. A no-op when prod is already current.
#   manual         → deploy any branch/tag/SHA, unconditionally.
#
# ── FUTURE: weekly release train ────────────────────────────────────────────
# The plan is for main to flow continuously to preview and reach production on a
# weekly cadence instead. To switch, delete the `push:` block below and uncomment
# the weekly `schedule` entry — nothing else changes, and deploy-preview.yml keeps
# tracking main so preview stays the always-current staging environment.
#
# PREREQUISITES (one-time, on the Plesk server):
#   1. Register a self-hosted runner for this repo (Settings → Actions →
#      Runners → New self-hosted runner) and install it as a service:
#        ./config.sh --url https://github.com/21072026/Internship --token <TOKEN> --labels self-hosted
#        sudo ./svc.sh install && sudo ./svc.sh start
#   2. Create /etc/internship-crm/prod.env (chmod 600) with the production
#      secrets — see infra/README.md. The runner's user must be able to read it
#      and run docker.
on:
  # No paths-ignore: the drift gate below already skips redundant builds, and
  # filtering docs-only merges out here would only delay them until the next
  # scheduled tick (the gate compares commit shas, so it would rebuild anyway).
  # Deploying every merge keeps the invariant simple: prod == origin/main.
  push:
    branches: [main]
  schedule:
    # Drift safety net; offset from deploy-preview.yml's so the two don't
    # contend for the single self-hosted runner.
    - cron: '53 */6 * * *'
    # Weekly release train — see "FUTURE" above. Mondays 06:00 UTC.
    # - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to deploy (default: main)'
        required: false
        default: 'main'

# Never cancel a deploy mid-container-swap — queue instead. Queued runs are cheap:
# the drift gate below turns a run whose commit is already live into a no-op.
concurrency:
  group: deploy-prod-self-hosted
  cancel-in-progress: false

jobs:
  # ── 1. Gate (on the server: one curl + one ls-remote) ───────────────────────
  # Stays on the self-hosted runner because the ground truth it reads is local:
  # http://127.0.0.1:3200/api/health needs no public reachability, no firewall
  # exception and no auth. The cost is a curl.
  gate:
    name: Check for drift
    runs-on: self-hosted
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # #1239 — NO `uses:` in a self-hosted job. Downloading an action archive
      # from codeload.github.com answers 429 from this box's IP (the GitHub-hosted
      # runners are unaffected), and it fails in "Set up job" — before a single
      # line of repo code runs. That killed every topic preview and every deploy
      # at the same point. Plain git over HTTPS is not throttled that way, and
      # these jobs only ever needed the infra/ scripts.
      - name: Fetch the repo (no action download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_REF: ${{ github.sha }}
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          [ -d .git ] || git init -q .
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token reaches git through a credential helper reading the
          # environment, so it is never in argv (readable via `ps` on a shared box)
          # and never written into .git/config.
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          if [ "$FETCH_DEPTH" = "0" ]; then
            # Full history: the forward-only guard in deploy-prod.sh asks
            # `git merge-base --is-ancestor` whether this commit predates the live
            # one, and a shallow clone cannot answer that.
            git -c credential.helper="$HELPER" fetch --no-tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*"
            git -c credential.helper="$HELPER" fetch --no-tags origin "$FETCH_REF"
          else
            git -c credential.helper="$HELPER" fetch --no-tags --depth="$FETCH_DEPTH" origin "$FETCH_REF"
          fi
          git checkout -q --force --detach FETCH_HEAD
          git clean -qfdx

      - name: Decide whether a deploy is needed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref || 'main' }}
          HEALTH_URL: http://127.0.0.1:3200/api/health
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same inline credential helper as the fetch step above — `git
          # ls-remote` below hit GitHub's unauthenticated-request rate limit
          # under heavy concurrent runner load ("could not read Username for
          # 'https://github.com'"), which failed the gate before it ever got
          # to the health check.
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'

          # Resolve the exact commit to deploy. Everything downstream (the image
          # tag, the GIT_SHA baked into it, the forward-only guard) is pinned to
          # this one sha so the build and the deploy can never disagree.
          #
          # Automatic runs target the TIP of origin/main rather than github.sha:
          # a run that queued behind a newer one must not land an older commit on
          # top of it (the regression #794 fixed for prod). Asking the remote also
          # beats trusting a local ref — this workspace is shared and shallow.
          if [ "$EVENT" = workflow_dispatch ]; then
            SHA="$(git -c credential.helper="$HELPER" ls-remote origin "refs/heads/$REF" | cut -f1)"
            [ -n "$SHA" ] || SHA="$(git -c credential.helper="$HELPER" ls-remote origin "refs/tags/$REF" | cut -f1)"
            [ -n "$SHA" ] || SHA="$REF"   # not a branch or tag — assume a raw sha
          else
            SHA="$(git -c credential.helper="$HELPER" ls-remote origin refs/heads/main | cut -f1)"
          fi
          [ -n "$SHA" ] || { echo "could not resolve '$REF'" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          TARGET="${SHA:0:7}"

          # A manual dispatch is the explicit override: always deploy, even the
          # commit that is already live (that's how you force a rebuild).
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "### Production: deploying \`$REF\` (\`$TARGET\`, manual dispatch)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Ground truth for what is actually live: the container reports the
          # GIT_SHA baked into its image at /api/health. An unreachable endpoint
          # (container down or wedged) counts as drift, so the deploy repairs it.
          # `sha` is gated on HEALTH_TOKEN when that is configured (#897); the
          # server env file is the same one deploy-prod.sh reads, so source it
          # if present and pass the header through. Absent token = old behaviour.
          HEALTH_ENV="${ENV_FILE:-/etc/internship-crm/prod.env}"
          # Sourced in a subshell so quoting matches how deploy-prod.sh reads it.
          [ -r "$HEALTH_ENV" ] && HEALTH_TOKEN="$( set -a; . "$HEALTH_ENV" >/dev/null 2>&1; printf '%s' "${HEALTH_TOKEN:-}" )"
          if [ -n "${HEALTH_TOKEN:-}" ]; then
            LIVE="$(curl -fsS --max-time 10 -H "X-Health-Token: $HEALTH_TOKEN" "$HEALTH_URL" \
                    | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)"
          else
            LIVE="$(curl -fsS --max-time 10 "$HEALTH_URL" \
                    | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)"
          fi
          if [ "$LIVE" = "$TARGET" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "### Production already current at \`$TARGET\` — nothing to deploy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "### Production drifted: live \`${LIVE:-unreachable}\` → deploying \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 2. Build (GitHub-hosted — the expensive part) ───────────────────────────
  build:
    name: Build image
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      tag: prod-${{ needs.gate.outputs.sha }}
      app_env: production

  # ── 3. Swap (on the server: pull + db push + restart) ───────────────────────
  deploy:
    name: Swap production container
    needs: [gate, build]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      # #1239 — NO `uses:` in a self-hosted job. Downloading an action archive
      # from codeload.github.com answers 429 from this box's IP (the GitHub-hosted
      # runners are unaffected), and it fails in "Set up job" — before a single
      # line of repo code runs. That killed every topic preview and every deploy
      # at the same point. Plain git over HTTPS is not throttled that way, and
      # these jobs only ever needed the infra/ scripts.
      - name: Fetch the repo (no action download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_REF: ${{ needs.gate.outputs.sha }}
          FETCH_DEPTH: '0'
        run: |
          set -euo pipefail
          [ -d .git ] || git init -q .
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token reaches git through a credential helper reading the
          # environment, so it is never in argv (readable via `ps` on a shared box)
          # and never written into .git/config.
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          if [ "$FETCH_DEPTH" = "0" ]; then
            # Full history: the forward-only guard in deploy-prod.sh asks
            # `git merge-base --is-ancestor` whether this commit predates the live
            # one, and a shallow clone cannot answer that.
            git -c credential.helper="$HELPER" fetch --no-tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*"
            git -c credential.helper="$HELPER" fetch --no-tags origin "$FETCH_REF"
          else
            git -c credential.helper="$HELPER" fetch --no-tags --depth="$FETCH_DEPTH" origin "$FETCH_REF"
          fi
          git checkout -q --force --detach FETCH_HEAD
          git clean -qfdx

      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x infra/deploy-prod.sh
          # --pull-image: the image was built on the hosted runner, so this box
          #   only fetches it — no npm ci, no next build, no buildkit.
          # --no-pull: the checkout above already pinned the exact commit the
          #   image was built from; don't let the script re-sync to a moving tip.
          # FORWARD_ONLY=1 makes prod refuse to regress to an older commit
          #   (FORCE=1 for a deliberate rollback).
          # Secrets come from the server-side env file, never from the repo/workflow.
          FORWARD_ONLY=1 \
          ENV_FILE="${ENV_FILE:-/etc/internship-crm/prod.env}" \
          ./infra/deploy-prod.sh --no-pull --pull-image

  # ── 4. Alert ────────────────────────────────────────────────────────────────
  # A failed deploy leaves the container swapped out (docker stop precedes
  # docker run), so silence here is the worst case: the env can be down, or
  # stuck on an older build, with nothing but a red tick in the Actions tab to
  # say so. Separate GitHub-hosted job on purpose — the server no longer runs
  # npm at all (#956), and an alert that needs `npm ci` on a box whose deploy
  # just failed is an alert that may never send.
  notify:
    name: Email alert on failure
    needs: [gate, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Send alert email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || 'mehmetersahin@gmail.com' }}
          ALERT_SUBJECT: '⚠️ Internship CRM — production deploy FAILED'
          ALERT_BODY: |
            The production deploy of ${{ needs.gate.outputs.sha || 'main' }} failed (event: ${{ github.event_name }}).
            The production container may be down or serving an older build — check before assuming a merge is live.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/send-alert-email.mjs
