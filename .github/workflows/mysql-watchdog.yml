name: MySQL Watchdog (database health)

# Watches the server's MySQL 8 from OUTSIDE the box, and is the only thing that
# tells a human when it is down.
#
# The database is being OOM-killed: the kernel picks mysqld, and every page of
# the app turns into an error until it is back. On the current box MySQL runs in
# the Docker container `internship-mysql` with `restart: unless-stopped`
# (infra/server/bootstrap.sh), so Docker brings it back by itself — on
# 2026-10-21 nine seconds after the kill. The Plesk-era on-box timer and systemd
# drop-in that used to do that are retired (#3135); infra/README.md → "MySQL
# watchdog" has the reasoning, and infra/mysql-watchdog.sh's header says why the
# script never restarts the database itself.
#
# What this workflow adds on top of Docker:
#   · it runs on a GitHub-HOSTED runner ON PURPOSE. A watchdog that needs the
#     sick server to be healthy is not a watchdog — when the box is so short of
#     memory that mysqld dies, its self-hosted runner can die too (both did on
#     2026-10-21);
#   · it is the only layer that ALERTS. Docker restarts quietly; a database
#     that is down and STAYING down (stopped by hand and forgotten, crash-
#     looping, running but not answering) is noticed only because this job goes
#     red and opens a `ci-alert` issue;
#   · its log keeps the evidence of the kills Docker did repair: the kernel's
#     OOM lines, the container's restart count, a memory snapshot.
#
# Requires the SSH_* secrets (SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, SSH_PORT)
# pointing at the Docker host; the SSH user needs the `docker` group (container
# state) and `adm` (kernel log). No sudo.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:

concurrency:
  group: mysql-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchdog:
    name: Check the database from outside the box
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Written via env var (not inline interpolation) to preserve the exact
          # OpenSSH format.
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || \
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # The script is copied over rather than pulled by the box: `git fetch` from
      # this server's IP has been answering 429 (#1239), and a watchdog that
      # depends on a rate-limited download is a watchdog that fails on the bad day.
      - name: Ship the watchdog to the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" 'mkdir -p ~/internship-infra'
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=no \
            infra/mysql-watchdog.sh "${SSH_USER}@${SSH_HOST}:~/internship-infra/mysql-watchdog.sh"

      - name: Check the database from outside the box
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -o pipefail
          if ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no \
              "${SSH_USER}@${SSH_HOST}" "bash -s" 2>&1 \
              <<'REMOTE' | tee /tmp/mysql-watchdog.txt
          set -uo pipefail
          chmod +x ~/internship-infra/mysql-watchdog.sh

          echo "== status =="
          ~/internship-infra/mysql-watchdog.sh --status || true

          echo "== check =="
          # This is what decides the job: exit 1 means the database is down AND
          # Docker did not bring it back within the script's wait, which is the
          # only state worth an alert at 3am.
          ~/internship-infra/mysql-watchdog.sh --check
          REMOTE
          then
            status=ok
          else
            status=fail
          fi
          {
            echo 'report<<REPORT_EOF'
            cat /tmp/mysql-watchdog.txt
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
          [ "$status" = ok ]

  # The SMTP-free trail (#2322): the e-mail below cannot leave a GitHub-hosted
  # runner, which made "the database is down" the alert least likely to arrive.
  # One `ci-alert` issue while the watchdog is red (one comment per UTC day at
  # most — this runs every 10 minutes), closed by the next green check.
  alert:
    name: Record the result as an issue (no SMTP)
    needs: [watchdog]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Open, refresh or close the database alert
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_KEY: mysql-watchdog
          ALERT_TITLE: '🛑 mysql-watchdog — the database is DOWN'
          ALERT_SUMMARY: |
            MySQL is not answering on the server and Docker has not brought it back. Every page that touches data is failing.
            First move on the box: `docker ps -a --filter name=internship-mysql` (stopped by hand? restarting in a loop?) and `docker logs --tail 50 internship-mysql`; the run log carries the watchdog's report. See infra/README.md → "MySQL watchdog".
        run: node scripts/ci-alert-issue.mjs ${{ needs.watchdog.result == 'success' && 'green' || 'red' }}

  notify:
    name: Email alert when the database is down
    needs: [watchdog]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Send alert email
        # Best effort (#2322): from a GitHub-hosted runner the SMTP connect
        # times out (~2 min, ETIMEDOUT on CONN), and the `ci-alert` issue is the
        # alert of record. Bounded, and never a second red job on top of it.
        timeout-minutes: 3
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || 'mehmetersahin@gmail.com' }}
          ALERT_SUBJECT: '🛑 Internship CRM — the database is DOWN'
          ALERT_BODY: |
            MySQL is not answering on the server and Docker has not brought
            it back. The app is up but every page that touches data is
            failing right now.

            First move: `docker ps -a --filter name=internship-mysql` and
            `docker logs --tail 50 internship-mysql` on the box — the report
            below already carries the container's state and mysqld's last
            lines. A stopped container is a `docker stop` nobody undid
            (`docker start internship-mysql` once whatever stopped it is
            done). If the kernel log shows OOM kills, restarts are only first
            aid: the box needs memory headroom. See infra/README.md →
            "MySQL watchdog".

            ${{ needs.watchdog.outputs.report }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/send-alert-email.mjs
