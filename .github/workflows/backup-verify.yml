name: Backup verification & restore drill

# The other half of #1181's backup automation (#1183, epic #1179).
#
# infra/backup-db.sh validates the dump it writes. Nothing validated that it is
# still RUNNING — and the way a backup dies is quiet: a cron entry lost in a
# server rebuild, a deploy hook failing before the backup step, a full disk.
# You find out on the day you need it.
#
# TWO CADENCES, on purpose:
#   · freshness check — DAILY. The issue asked for monthly; monthly means up to
#     30 days of believing you have backups when you do not, and the check costs
#     seconds. Daily is the cadence the failure mode deserves.
#   · restore drill — MONTHLY. It creates a scratch copy of real data and takes
#     minutes, so it runs on the 1st and is otherwise on-demand.
#
# Both run on the SELF-HOSTED runner because the dumps only exist on that box.
# The alert job runs GitHub-hosted: an alert that needs the failing server to be
# healthy is an alert that may never send.

on:
  schedule:
    - cron: '20 6 * * *'   # daily 06:20 UTC — after the 03:15 backup cron
  workflow_dispatch:
    inputs:
      drill:
        description: 'Also run the restore drill (restores into a scratch DB)'
        type: boolean
        default: false
      env_name:
        description: 'Environment to drill (prod or preview)'
        type: choice
        options: [preview, prod]
        default: preview
      drill_source:
        description: 'Restore from the local dumps or the encrypted off-site (restic/R2) copy (#2058)'
        type: choice
        options: [local, offsite]
        default: local

concurrency:
  group: backup-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Check backup freshness
    # Both hosts run a self-hosted runner during the #2166 migration, and a bare
    # `self-hosted` label would send this job to whichever one happens to be
    # online — at random, mid-cutover. vars.DEPLOY_RUNNER names the intended box.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    outputs:
      report: ${{ steps.check.outputs.report }}
      freshness: ${{ steps.check.outcome }}
      drill_ran: ${{ steps.drill.outputs.drill_ran }}
    steps:
      # #1239 — NO `uses:` in a self-hosted job. Downloading an action archive
      # from codeload.github.com answers 429 from this box's IP (the GitHub-hosted
      # runners are unaffected), and it fails in "Set up job" — before a single
      # line of repo code runs. That killed every topic preview and every deploy
      # at the same point. Plain git over HTTPS is not throttled that way, and
      # these jobs only ever needed the infra/ scripts.
      - name: Fetch the repo (no action download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_REF: ${{ github.sha }}
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          [ -d .git ] || git init -q .
          # A job killed mid-fetch (cancelled run, runner restart) can leave this
          # behind; every subsequent fetch on this box then fails outright (#2143).
          rm -f .git/index.lock
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token reaches git through a credential helper reading the
          # environment, so it is never in argv (readable via `ps` on a shared box)
          # and never written into .git/config.
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          if [ "$FETCH_DEPTH" = "0" ]; then
            # Full history: the forward-only guard in deploy-prod.sh asks
            # `git merge-base --is-ancestor` whether this commit predates the live
            # one, and a shallow clone cannot answer that.
            git -c credential.helper="$HELPER" fetch --no-tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*"
            git -c credential.helper="$HELPER" fetch --no-tags origin "$FETCH_REF"
          else
            git -c credential.helper="$HELPER" fetch --no-tags --depth="$FETCH_DEPTH" origin "$FETCH_REF"
          fi
          git checkout -q --force --detach FETCH_HEAD
          git clean -qfdx

      - name: Backup freshness & integrity
        id: check
        continue-on-error: false
        run: |
          set -o pipefail
          chmod +x infra/check-backups.sh
          # Tee so the same text reaches the log, the job summary (inside the
          # script) and the alert email — one report, not three descriptions.
          if ./infra/check-backups.sh --env prod --env preview 2>&1 | tee /tmp/backup-check.txt; then
            status=ok
          else
            status=fail
          fi
          {
            echo 'report<<EOF'
            cat /tmp/backup-check.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
          [ "$status" = ok ]

      # Only on the 1st of the month, or when asked for by hand. The drill
      # restores REAL data into a throwaway database and drops it afterwards;
      # infra/restore-drill.sh refuses any target that isn't clearly scratch.
      - name: Restore drill
        id: drill
        env:
          # The drill needs the server address and credentials only — it never
          # reads from or writes to the database named here.
          DRILL_ENV: ${{ github.event.inputs.env_name || 'preview' }}
          FORCE_DRILL: ${{ github.event.inputs.drill }}
          DRILL_SOURCE: ${{ github.event.inputs.drill_source || 'local' }}
        run: |
          # Actions expressions have no date function, so the monthly cadence is
          # decided here: the 1st of the month, or whenever asked for by hand.
          if [ "$FORCE_DRILL" != "true" ] && [ "$(date -u +%d)" != "01" ]; then
            echo "Not the 1st and not requested — skipping the drill."
            exit 0
          fi
          set -a; . /etc/internship-crm/preview.env; set +a
          chmod +x infra/restore-drill.sh
          # Mark which half failed. Without this the alert below says "BACKUP
          # CHECK FAILED" for a drill problem — telling the maintainer their
          # backups are broken when the report two steps up says they are fine.
          # A false alarm costs the same trust as a missed one.
          echo "drill_ran=1" >> "$GITHUB_OUTPUT"
          if [ "$DRILL_SOURCE" = offsite ]; then
            # The restic credentials file is root-only (0600, written by
            # backup-offsite-setup.yml), so the off-site drill runs under sudo
            # with just the two variables it needs passed through.
            sudo --preserve-env=DATABASE_URL,GITHUB_STEP_SUMMARY \
              ./infra/restore-drill.sh --env "$DRILL_ENV" --target internship_restore_test --source offsite
          else
            ./infra/restore-drill.sh --env "$DRILL_ENV" --target internship_restore_test
          fi

  # The off-site copy (#2058), witnessed from OUTSIDE the box. The verify job
  # above runs on the production host, so it cannot see that host being lost;
  # this one runs GitHub-hosted, reads only snapshot metadata from the restic
  # repository on R2 (written by infra/server/backup-offsite.sh) and goes red
  # through the same issue and email. Until the R2 secrets exist it reports
  # "not configured" and stays green — a check that cannot run must not page
  # anyone, but it says so in the summary every day.
  verify-offsite:
    name: Check the off-site copy (from a hosted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - name: Off-site freshness
        id: check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          BUCKET: ${{ vars.OFFSITE_BUCKET || 'internship-crm-backups' }}
        run: |
          set -o pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$RESTIC_PASSWORD" ]; then
            msg="⚠️ off-site check not configured: set the R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and RESTIC_PASSWORD repository secrets (docs/disaster-recovery.md § Off-site copy)."
            echo "::notice::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo apt-get install -y -qq restic >/dev/null
          export RESTIC_REPOSITORY="s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${BUCKET}"
          if bash infra/check-backups-offsite.sh 2>&1 | tee /tmp/offsite.txt; then status=ok; else status=fail; fi
          cat /tmp/offsite.txt >> "$GITHUB_STEP_SUMMARY"
          { echo 'report<<EOF'; cat /tmp/offsite.txt; echo EOF; } >> "$GITHUB_OUTPUT"
          [ "$status" = ok ]

  # The trail that does not need SMTP (#2322): one `ci-alert` issue while the
  # check is red, closed by the next green run. Its own job on a hosted runner
  # (the verify job is self-hosted and must not `uses:`, #1239), and separate
  # from `notify` so a hanging SMTP connect there cannot starve it.
  alert-issue:
    name: Record the result as an issue
    needs: [verify, verify-offsite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Open, refresh or close the backup alert
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_KEY: backup-verify
          ALERT_TITLE: ${{ (needs.verify.result == 'success' && needs.verify-offsite.result != 'success') && '🛟 backup-verify — the OFF-SITE copy is red (local backups are fine)' || needs.verify.outputs.drill_ran == '1' && '🛟 backup-verify — the restore DRILL is red (backups themselves are fine)' || '🛟 backup-verify — the backup freshness check is red' }}
          ALERT_SUMMARY: |
            ${{ (needs.verify.result == 'success' && needs.verify-offsite.result != 'success')
              && 'The off-site (restic/R2) check failed. Local dumps are fine, but if this host is lost there may be no surviving copy.'
              || needs.verify.outputs.drill_ran == '1'
              && 'The restore drill failed. The freshness check passed, so the backups exist and look well-formed; what is unproven is that they restore.'
              || 'The backup freshness check failed. Until this is fixed, assume there is NO usable backup.' }}
            ${{ needs.verify-offsite.outputs.report }}
            What to do: `docs/disaster-recovery.md` → "When the check fails".
        run: node scripts/ci-alert-issue.mjs ${{ (needs.verify.result == 'success' && needs.verify-offsite.result == 'success') && 'green' || 'red' }}

  notify:
    name: Email alert on failure
    needs: [verify, verify-offsite]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Send alert email
        # Best effort (#2322): from a GitHub-hosted runner the SMTP connect
        # times out (~2 min, ETIMEDOUT on CONN), and the `ci-alert` issue is the
        # alert of record. Bounded, and never a second red job on top of it.
        timeout-minutes: 3
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || 'mehmetersahin@gmail.com' }}
          ALERT_SUBJECT: ${{ (needs.verify.result == 'success' && needs.verify-offsite.result != 'success') && '🛟 Internship CRM — OFF-SITE BACKUP CHECK FAILED (local backups are fine)' || needs.verify.outputs.drill_ran == '1' && '🛟 Internship CRM — RESTORE DRILL FAILED (backups themselves are fine)' || '🛟 Internship CRM — BACKUP CHECK FAILED' }}
          ALERT_BODY: |
            ${{ needs.verify.outputs.drill_ran == '1'
              && 'The restore DRILL failed. The freshness check passed, so the backups exist and look well-formed — what is unproven is that they can be restored. Treat this as "recovery untested", not "no backups".'
              || 'The backup freshness check failed. Until this is fixed, assume there is NO usable backup.' }}

            ${{ needs.verify.outputs.report }}
            ${{ needs.verify-offsite.outputs.report }}

            What to do: docs/disaster-recovery.md → "When the check fails".
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/send-alert-email.mjs
