name: Topic Preview (hosted build → server swap, auto per-PR)

# Per-PR ephemeral preview environments (issue #583).
#
# Every open PR automatically gets its own isolated environment:
#   PR #123 → container internship-crm-pr123 on a dedicated port →
#             https://pr123.<domain>            (internship world)
#             https://pr123-m.<domain>          (marketing world, #2612)
# Both names are one DNS label, so they ride the same *.interncrm.com wildcard
# cert. MARKETING_HOSTS is set to the -m host inside the container — never
# inherited from preview.env, which names the shared preview marketing domain.
# A bot comment on the PR carries the URL (updated on every push). When the PR
# is merged or closed, the environment (container + image + Caddy route) is torn
# down so it stops consuming server resources.
#
# THE IMAGE IS BUILT ON A GITHUB-HOSTED RUNNER (build-image.yml) and pushed to
# ghcr; the server only pulls it and does the container swap + routing. This was
# the single heaviest load the CI put on the production box: while the repo was
# private and out of Actions quota (#636) the server ran a full `npm ci` +
# `next build` for EVERY push to EVERY open PR. The repo is public now, so hosted
# runners are free — the compiling belongs there. (Private and metered
# 2026-10-08..14, public again since 2026-10-14, #2949.)
#
# PREREQUISITES (one-time, on the server — see infra/README.md):
#   1. The self-hosted runner is registered and its user can run docker AND the
#      Caddy with `import /etc/caddy/sites/*.caddy` (topic-deploy.sh writes the
#      per-PR site file and reloads; the `plesk` CLI branch is the retired box's
#      fallback and is not taken here).
#   2. Wildcard DNS *.interncrm.com → the server (infra/setup-dns-cloudflare.sh) and a
#      wildcard TLS cert in ${CERT_DIR} (infra/acme-issue-wildcard.sh).
#   3. /etc/internship-crm/preview.env (chmod 600) with DATABASE_URL,
#      NEXTAUTH_SECRET, SMTP_* — the same file deploy-preview uses.
#   4. The DB user in that file can create and drop the per-topic databases:
#        GRANT ALL PRIVILEGES ON `internship\_pr%`.* TO '<user>'@'%';
#
# Each topic gets its OWN database, `internship_pr<N>` (#1185): a `db push` on
# one PR no longer reshapes the schema under every other PR, and no real preview
# data is reachable from a topic environment — they are seeded with the
# synthetic demo set only. The database is dropped when the PR closes, and the
# daily topic sweep removes any that leak.
#
# FORK PRs get no topic environment: GitHub keeps their GITHUB_TOKEN read-only
# (so the image cannot be pushed to ghcr) and withholds repo secrets, and running
# unreviewed fork code on the production host is not something to work around.
# ci.yml + e2e.yml still gate those PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# One in-flight run per PR; a new push cancels the previous deploy.
concurrency:
  group: topic-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Repo variable, so a future domain move is a settings change rather than a PR.
  # The literal is the post-migration default (#2166/#2197): the old ersah.in host
  # is retired and only 301s, so it must never be the fallback again.
  BASE_DOMAIN: ${{ vars.BASE_DOMAIN || 'interncrm.com' }}
  # Hostname prefix for environment names, empty by default (pr123.<domain>).
  # Kept as a variable only so it can be put back to `crm-` without a PR if
  # something downstream turns out to assume it.
  ENV_PREFIX: ${{ vars.ENV_PREFIX }}
  # Where the shared preview secrets live on the server (same as deploy-preview).
  ENV_FILE: /etc/internship-crm/preview.env

jobs:
  # ── Build (GitHub-hosted — the expensive part) ───────────────────────────────
  # app_env=preview so a topic env wears the green accent + "preview" badge and
  # can't be mistaken for production (src/lib/appEnv.ts).
  build:
    name: Build image
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      # The PR branch tip, not the synthetic merge commit: a topic preview exists
      # to show the author their own commit, and this sha is what /api/health and
      # the version footer will report.
      ref: ${{ github.event.pull_request.head.sha }}
      tag: topic-pr${{ github.event.pull_request.number }}
      app_env: preview

  # ── Still mergeable? (GitHub-hosted, seconds) ───────────────────────────────
  # GitHub starts no pull_request run for a PR that is already in conflict, but
  # a run that started clean keeps going when another PR lands on main mid-build
  # and makes this one conflict. Its deploy (image pull, db push, seed, swap on
  # the shared box) is then pure waste: the conflict can only be resolved by a
  # new push, and that push builds and deploys again. So the box is skipped when
  # GitHub says the head conflicts with its base right now.
  #
  # FAILS OPEN: `conflicted` is 'true' only for an explicit `mergeable: false`
  # with `mergeable_state: dirty`. Mergeability still being computed (null), an
  # API error or anything else deploys exactly as before.
  mergeable:
    name: Check the PR is still mergeable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      conflicted: ${{ steps.check.outputs.conflicted }}
    steps:
      - name: Ask GitHub for the PR's merge state
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          conflicted=false
          # Mergeability is computed lazily after a push to the base; give it a
          # short while instead of reading the first `null` as an answer.
          for i in 1 2 3 4 5 6; do
            state=$(gh api "repos/${REPO}/pulls/${PR}" --jq '"\(.mergeable) \(.mergeable_state)"' 2>/dev/null || echo "error error")
            echo "attempt ${i}: mergeable mergeable_state = ${state}"
            case "$state" in
              "false dirty") conflicted=true; break ;;
              null*|*unknown) sleep 5 ;;
              *) break ;;
            esac
          done
          echo "conflicted=${conflicted}" >> "$GITHUB_OUTPUT"
          if [ "$conflicted" = true ]; then
            echo "::notice::PR #${PR} conflicts with its base — skipping the topic deploy; the push that resolves it deploys again."
          fi

  # ── Deploy / update (PR opened, pushed to, or reopened) ──────────────────────
  deploy:
    name: Deploy topic environment
    needs: [build, mergeable]
    # Skipped while the head conflicts with main (see `mergeable` above). The
    # always() keeps that check fail-open: a `mergeable` job that died for any
    # reason leaves `conflicted` empty and the deploy runs as before.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.mergeable.outputs.conflicted != 'true'
    # Both hosts run a self-hosted runner during the #2166 migration, and a bare
    # `self-hosted` label would send this job to whichever one happens to be
    # online — at random, mid-cutover. vars.DEPLOY_RUNNER names the intended box.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    # Set by topic-deploy.sh's capacity check (infra/server/capacity.sh): a
    # deferred deploy ends green and the comment job says the server is busy.
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      reason: ${{ steps.deploy.outputs.reason }}
    steps:
      - name: Derive topic + port from PR number
        id: t
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "topic=pr${PR}" >> "$GITHUB_OUTPUT"
          # Deterministic port in 3400–3499 (prod=3200, preview=3201, buch=3202).
          # 100 slots; PRs whose numbers collide mod 100 clash — fine at our volume.
          #
          # NOT 3300–3399, which is where this used to live: slot 06 lands on
          # 3306, and 3306 is MariaDB. Every PR numbered ...06 therefore tried to
          # publish a container on the database's port and died with "address
          # already in use" — a permanent collision, not a volume problem (#1208,
          # hit by #1206). 3389 (RDP) sits in that block too. 3400–3499 is clear
          # of both and, checked on the box, of everything else.
          echo "port=$((3400 + PR % 100))" >> "$GITHUB_OUTPUT"

      # #1239 — NO `uses:` in a self-hosted job. Downloading an action archive
      # from codeload.github.com answers 429 from this box's IP (the GitHub-hosted
      # runners are unaffected), and it fails in "Set up job" — before a single
      # line of repo code runs. That killed every topic preview and every deploy
      # at the same point. Plain git over HTTPS is not throttled that way, and
      # these jobs only ever needed the infra/ scripts.
      - name: Fetch the repo (no action download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_REF: ${{ github.event.pull_request.head.sha }}
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          [ -d .git ] || git init -q .
          # A job killed mid-fetch (cancelled run, runner restart) can leave this
          # behind; every subsequent fetch on this box then fails outright (#2143).
          rm -f .git/index.lock
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token reaches git through a credential helper reading the
          # environment, so it is never in argv (readable via `ps` on a shared box)
          # and never written into .git/config.
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          if [ "$FETCH_DEPTH" = "0" ]; then
            # Full history: the forward-only guard in deploy-prod.sh asks
            # `git merge-base --is-ancestor` whether this commit predates the live
            # one, and a shallow clone cannot answer that.
            git -c credential.helper="$HELPER" fetch --no-tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*"
            git -c credential.helper="$HELPER" fetch --no-tags origin "$FETCH_REF"
          else
            git -c credential.helper="$HELPER" fetch --no-tags --depth="$FETCH_DEPTH" origin "$FETCH_REF"
          fi
          git checkout -q --force --detach FETCH_HEAD
          git clean -qfdx

      - name: Deploy topic environment
        id: deploy
        env:
          TOPIC: ${{ steps.t.outputs.topic }}
          PORT: ${{ steps.t.outputs.port }}
          IMAGE: ${{ needs.build.outputs.image }}
          BASE_DOMAIN: ${{ env.BASE_DOMAIN }}
          ENV_PREFIX: ${{ env.ENV_PREFIX }}
          ENV_FILE: ${{ env.ENV_FILE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Capacity knobs (infra/server/capacity.sh); empty → the script's defaults.
          TOPIC_MAX_ENVS: ${{ vars.TOPIC_MAX_ENVS }}
          TOPIC_MEMORY_MB: ${{ vars.TOPIC_MEMORY_MB }}
          TOPIC_HEADROOM_MB: ${{ vars.TOPIC_HEADROOM_MB }}
        run: |
          # An empty repo variable must mean "default", not "0".
          for v in TOPIC_MAX_ENVS TOPIC_MEMORY_MB TOPIC_HEADROOM_MB; do [ -n "${!v}" ] || unset "$v"; done
          chmod +x infra/server/topic-deploy.sh
          # No SKIP_PULL: the image comes from ghcr, built on the hosted runner.
          ./infra/server/topic-deploy.sh

  # ── Say where it is (GitHub-hosted) ─────────────────────────────────────────
  # Separate job on purpose (#1239): posting a comment needs GitHub, not the
  # server, and every `uses:` inside a self-hosted job is an action archive this
  # box has to download from codeload — which is exactly what 429s.
  comment:
    name: Comment topic URL on the PR
    needs: [mergeable, deploy]
    # Also after a deploy skipped for a conflict, so the comment stops pointing
    # at an environment built from an older commit.
    if: >-
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.deploy.result == 'success' || needs.mergeable.outputs.conflicted == 'true')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          DEPLOYED: ${{ needs.deploy.outputs.deployed }}
          CONFLICTED: ${{ needs.mergeable.outputs.conflicted }}
          REASON: ${{ needs.deploy.outputs.reason }}
        with:
          script: |
            const topic = `pr${context.issue.number}`;
            const url = `https://${{ env.ENV_PREFIX }}${topic}.${{ env.BASE_DOMAIN }}`;
            const marketingUrl = `https://${{ env.ENV_PREFIX }}${topic}-m.${{ env.BASE_DOMAIN }}`;
            const marker = '<!-- topic-preview -->';
            // Deferred by the capacity check: say so, and never point at an
            // environment that was not deployed. An older "ready" comment is
            // replaced, because what it points at may be an older commit.
            const deferred = process.env.DEPLOYED === 'false';
            const conflicted = process.env.CONFLICTED === 'true';
            const body = conflicted
              ? `${marker}\n### ⏸ Topic preview not deployed — this branch conflicts with \`main\`\n\n` +
                `Another change landed on \`main\` while this push was building, and the branch can no longer ` +
                `be merged as is. Deploying it would only be replaced again, so the server was left alone.\n\n` +
                `> Resolve the conflict and push — that push builds and deploys the environment again.`
              : deferred
              ? `${marker}\n### ⏸ Topic preview not deployed — the server is busy\n\n` +
                `${process.env.REASON || 'The shared server has no room for another environment right now.'}\n\n` +
                `> Nothing is wrong with this PR, and CI is not affected. The environment is deployed on the next ` +
                `push, or re-run the **Topic Preview** workflow once other PRs have been merged or closed.`
              : `${marker}\n### 🧪 Topic preview ready\n\n` +
              `Branch **\`${{ github.head_ref }}\`** → **${url}**\n` +
              `Marketing world → **${marketingUrl}** (#2612)\n\n` +
              `> Isolated environment for this PR (container \`internship-crm-${topic}\`, ` +
              `database \`internship_${topic}\`). Rebuilt on every push; container and database are ` +
              `both removed when this PR is merged or closed.\n` +
              `> Its own database, seeded with synthetic demo data — sign in with ` +
              `\`admin.demo@demo.example.com\` / \`DemoPass123!\` (marketing: \`admin.marketing@demo.example.com\`, ` +
              `same password). Schema changes here affect nobody else.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # ── Teardown (PR merged / closed) ────────────────────────────────────────────
  # Runs for fork PRs too: harmless (nothing to remove) and it keeps the teardown
  # unconditional, so an environment can never outlive its PR.
  teardown:
    name: Tear down topic environment
    if: github.event.action == 'closed'
    # See the note on the first runs-on in this file (#2166).
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    steps:
      # #1239 — NO `uses:` in a self-hosted job. Downloading an action archive
      # from codeload.github.com answers 429 from this box's IP (the GitHub-hosted
      # runners are unaffected), and it fails in "Set up job" — before a single
      # line of repo code runs. That killed every topic preview and every deploy
      # at the same point. Plain git over HTTPS is not throttled that way, and
      # these jobs only ever needed the infra/ scripts.
      - name: Fetch the repo (no action download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `github.sha` on a closed PR is the merge ref, which may already be
          # gone; the base branch is always there and carries the same scripts.
          FETCH_REF: ${{ github.event.pull_request.base.ref }}
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          [ -d .git ] || git init -q .
          # A job killed mid-fetch (cancelled run, runner restart) can leave this
          # behind; every subsequent fetch on this box then fails outright (#2143).
          rm -f .git/index.lock
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token reaches git through a credential helper reading the
          # environment, so it is never in argv (readable via `ps` on a shared box)
          # and never written into .git/config.
          HELPER='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          if [ "$FETCH_DEPTH" = "0" ]; then
            # Full history: the forward-only guard in deploy-prod.sh asks
            # `git merge-base --is-ancestor` whether this commit predates the live
            # one, and a shallow clone cannot answer that.
            git -c credential.helper="$HELPER" fetch --no-tags --prune origin \
              "+refs/heads/*:refs/remotes/origin/*"
            git -c credential.helper="$HELPER" fetch --no-tags origin "$FETCH_REF"
          else
            git -c credential.helper="$HELPER" fetch --no-tags --depth="$FETCH_DEPTH" origin "$FETCH_REF"
          fi
          git checkout -q --force --detach FETCH_HEAD
          git clean -qfdx

      - name: Tear down
        env:
          TOPIC: pr${{ github.event.pull_request.number }}
          BASE_DOMAIN: ${{ env.BASE_DOMAIN }}
          ENV_PREFIX: ${{ env.ENV_PREFIX }}
        run: |
          chmod +x infra/server/topic-teardown.sh
          ./infra/server/topic-teardown.sh
