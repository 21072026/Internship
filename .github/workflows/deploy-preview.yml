name: Deploy preview (hosted build → server swap, auto on main)

# PREVIEW deploy — the sibling of deploy-prod.yml. The IMAGE IS BUILT ON A
# GITHUB-HOSTED RUNNER (build-image.yml) and pushed to ghcr; the Plesk server
# only pulls it and swaps the container, so preview
# (https://crm-preview.ersah.in, container internship-crm-preview on :3201) is
# kept in step with main without the box ever compiling anything.
#
# WHY THIS IS AUTOMATIC (#800): preview used to be dispatch-only. Once per-PR
# topic previews (topic-preview.yml) took over the per-PR job, nobody remembered
# to dispatch this one — preview sat 72 commits / 11 minor versions behind prod
# (0.14.1-beta vs 0.25.14-beta) for a week before anyone noticed. Preview is the
# first stop for merged code, so it now follows main on its own:
#
#   push to main   → deploy (this is the normal path)
#   every 6 hours  → deploy ONLY if preview drifted from origin/main; the
#                    self-hosted runner can be offline when a push arrives (see
#                    runner-watchdog.yml) and that deploy would otherwise be
#                    lost silently. A no-op when preview is already current.
#   manual         → deploy any branch/tag/SHA, unconditionally.
#
# It reuses infra/deploy-prod.sh unchanged — that script is fully parameterized
# (CONTAINER / PORT / IMAGE / ENV_FILE / NETWORK), so preview is just the prod
# deploy with preview overrides.
#
# SECRETS: read from /etc/internship-crm/preview.env on the server (same shape as
# prod.env: DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL=the preview URL, SMTP_*).
# If that file is absent, deploy-prod.sh derives it from the currently running
# internship-crm-preview container, so no manual setup is needed as long as a
# preview container already exists.
#
# ⚠️ The preview DB is SHARED across all previews (see CLAUDE.md) — a schema
# `db push` here affects every preview. That is unchanged from the old
# deploy.yml behavior.
on:
  # No paths-ignore: the drift gate below already skips redundant builds, and
  # filtering docs-only merges out here would only delay them until the next
  # scheduled tick (the gate compares commit shas, so it would rebuild anyway).
  # Deploying every merge keeps the invariant simple: preview == origin/main.
  push:
    branches: [main]
  schedule:
    # Drift safety net; offset from deploy-prod.yml's so the two don't contend
    # for the single self-hosted runner.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to deploy to preview (default: main)'
        required: false
        default: 'main'

# Never cancel a deploy mid-container-swap — queue instead. Queued runs are cheap:
# the drift gate below turns a run whose commit is already live into a no-op.
concurrency:
  group: deploy-preview-self-hosted
  cancel-in-progress: false

jobs:
  # ── 1. Gate (on the server: one curl + one ls-remote) ───────────────────────
  # Stays on the self-hosted runner because the ground truth it reads is local:
  # http://127.0.0.1:3201/api/health needs no public reachability, no firewall
  # exception and no auth. The cost is a curl.
  gate:
    name: Check for drift
    runs-on: self-hosted
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether a deploy is needed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref || 'main' }}
          HEALTH_URL: http://127.0.0.1:3201/api/health
        run: |
          # Resolve the exact commit to deploy. Everything downstream (the image
          # tag, the GIT_SHA baked into it, the container that ends up running) is
          # pinned to this one sha so the build and the deploy cannot disagree.
          #
          # Automatic runs target the TIP of origin/main rather than github.sha:
          # a run that queued behind a newer one must not land an older commit on
          # top of it (the regression #794 fixed for prod). Asking the remote also
          # beats trusting a local ref — this workspace is shared and shallow.
          if [ "$EVENT" = workflow_dispatch ]; then
            SHA="$(git ls-remote origin "refs/heads/$REF" | cut -f1)"
            [ -n "$SHA" ] || SHA="$(git ls-remote origin "refs/tags/$REF" | cut -f1)"
            [ -n "$SHA" ] || SHA="$REF"   # not a branch or tag — assume a raw sha
          else
            SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          fi
          [ -n "$SHA" ] || { echo "could not resolve '$REF'" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          TARGET="${SHA:0:7}"

          # A manual dispatch is the explicit override: always deploy, even the
          # commit that is already live (that's how you force a rebuild).
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "### Preview: deploying \`$REF\` (\`$TARGET\`, manual dispatch)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Ground truth for what is actually live: the container reports the
          # GIT_SHA baked into its image at /api/health. An unreachable endpoint
          # (container down or wedged) counts as drift, so the deploy repairs it.
          # `sha` is gated on HEALTH_TOKEN when that is configured (#897); the
          # server env file is the same one deploy-prod.sh reads, so source it
          # if present and pass the header through. Absent token = old behaviour.
          HEALTH_ENV="${ENV_FILE:-/etc/internship-crm/preview.env}"
          # Sourced in a subshell so quoting matches how deploy-prod.sh reads it.
          [ -r "$HEALTH_ENV" ] && HEALTH_TOKEN="$( set -a; . "$HEALTH_ENV" >/dev/null 2>&1; printf '%s' "${HEALTH_TOKEN:-}" )"
          if [ -n "${HEALTH_TOKEN:-}" ]; then
            LIVE="$(curl -fsS --max-time 10 -H "X-Health-Token: $HEALTH_TOKEN" "$HEALTH_URL" \
                    | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)"
          else
            LIVE="$(curl -fsS --max-time 10 "$HEALTH_URL" \
                    | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)"
          fi
          if [ "$LIVE" = "$TARGET" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "### Preview already current at \`$TARGET\` — nothing to deploy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "### Preview drifted: live \`${LIVE:-unreachable}\` → deploying \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 2. Build (GitHub-hosted — the expensive part) ───────────────────────────
  # app_env=preview bakes in the green accent + "preview" badge (src/lib/appEnv.ts)
  # so preview can't be mistaken for production. The self-hosted local build this
  # replaces never passed the build-arg, so preview had been wearing production's
  # blue since #636.
  build:
    name: Build image
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      tag: preview-${{ needs.gate.outputs.sha }}
      app_env: preview

  # ── 3. Swap (on the server: pull + db push + restart) ───────────────────────
  deploy:
    name: Swap preview container
    needs: [gate, build]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x infra/deploy-prod.sh
          ENV_FILE="${ENV_FILE:-/etc/internship-crm/preview.env}"

          # Preview has no hand-written secrets file — deploy-prod.sh derives one
          # from the running preview container when it is absent. Keep a good file
          # (re-deriving on every run would destroy the only copy the moment the
          # container is gone), but drop an unreadable/incomplete one so the
          # derivation regenerates it. Self-healing without being destructive.
          if [ -f "$ENV_FILE" ] && \
             ! ( set -a; . "$ENV_FILE" >/dev/null 2>&1; [ -n "${DATABASE_URL:-}" ] ); then
            echo "preview env file is malformed or incomplete — removing so it is re-derived"
            rm -f "$ENV_FILE" || true
          fi

          # Same script as prod, with preview container/port/env overrides.
          # --pull-image: the image was built on the hosted runner, so this box
          #   only fetches it — no npm ci, no next build, no buildkit.
          # --no-pull: the checkout above already pinned the exact commit the
          #   image was built from; don't let the script re-sync to a moving tip.
          # NETWORK=bridge: the preview DB user is granted from the docker
          #   gateway (host.docker.internal), not localhost, so preview uses
          #   bridge networking + a published port instead of host networking.
          # FORWARD_ONLY is deliberately unset — preview must stay able to deploy
          #   arbitrary/older refs on demand.
          CONTAINER=internship-crm-preview \
          PORT=3201 \
          NETWORK=bridge \
          ENV_FILE="$ENV_FILE" \
          ./infra/deploy-prod.sh --no-pull --pull-image

  # ── 4. Alert ────────────────────────────────────────────────────────────────
  # A failed deploy leaves the container swapped out (docker stop precedes
  # docker run), so silence here is the worst case: the env can be down, or
  # stuck on an older build, with nothing but a red tick in the Actions tab to
  # say so. Separate GitHub-hosted job on purpose — the server no longer runs
  # npm at all (#956), and an alert that needs `npm ci` on a box whose deploy
  # just failed is an alert that may never send.
  notify:
    name: Email alert on failure
    needs: [gate, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Send alert email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || 'mehmetersahin@gmail.com' }}
          ALERT_SUBJECT: '⚠️ Internship CRM — preview deploy FAILED'
          ALERT_BODY: |
            The preview deploy of ${{ needs.gate.outputs.sha || 'main' }} failed (event: ${{ github.event_name }}).
            The preview container may be down or serving an older build — check before assuming a merge is live.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/send-alert-email.mjs
